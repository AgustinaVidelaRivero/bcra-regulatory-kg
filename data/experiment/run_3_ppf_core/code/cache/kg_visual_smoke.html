de terceros\u2013 conteniendo im\u00e1genes cuenten, adem\u00e1s, con el texto alternativo descriptivo.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_operacion_electronica", "label": "Operaci\u00f3n en banca por Internet y m\u00f3vil", "shape": "dot", "size": 12, "title": "\u003cb\u003eOperaci\u00f3n en banca por Internet y m\u00f3vil\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: operaci\u00f3n electr\u00f3nica\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cualquiera_sea_la_tecnologia_y_o_el_software_que_se_utilice_debera_garantizar_qu", "label": "Garant\u00eda de no discriminaci\u00f3n visual", "shape": "dot", "size": 12, "title": "\u003cb\u003eGarant\u00eda de no discriminaci\u00f3n visual\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cualquiera sea la tecnolog\u00eda y/o el software que se utilice, deber\u00e1 garantizar que los usuarios con dificultad visual tengan acceso a las mencionadas plataformas operativas, en condiciones de igualdad, evitando cualquier tipo de discriminaci\u00f3n.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_entidades_financieras_los_pspcp_y_los_psi_en_la_medida_en_que_corresponda_de", "label": "Capacitaci\u00f3n en perspectiva de discapacidad y LSA", "shape": "dot", "size": 12, "title": "\u003cb\u003eCapacitaci\u00f3n en perspectiva de discapacidad y LSA\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las entidades financieras, los PSPCP y los PSI, en la medida en que corresponda, deber\u00e1n promover la capacitaci\u00f3n del personal de atenci\u00f3n al p\u00fablico en materia de perspectiva de discapacidad \u2013basada en el principio de accesibilidad\u2013 y en la Lengua de Se\u00f1as Argentina (LSA), a efectos de brindar atenci\u00f3n garantizando el acceso en condiciones de igualdad y mediante un trato respetuoso a usuarios con dificultad o discapacidad auditiva y/o del habla, evitando todo tipo de discriminaci\u00f3n.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_deberan_facilitar_su_atencion_en_las_casas_operativas_por_medio_de_su_personal_c", "label": "Atenci\u00f3n a usuarios con dificultades auditivas", "shape": "dot", "size": 12, "title": "\u003cb\u003eAtenci\u00f3n a usuarios con dificultades auditivas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Deber\u00e1n facilitar su atenci\u00f3n en las casas operativas por medio de su personal capacitado y/o de videollamadas con equipos de interpretaci\u00f3n de lengua de se\u00f1as argentina realizando para ello una distribuci\u00f3n eficiente de sus recursos, teniendo en cuenta la ubicaci\u00f3n y zona geogr\u00e1fica de influencia de sus casas operativas a los efectos de lograr la mayor cobertura con este servicio a los usuarios con discapacidad que lo requieran.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_accesibilidad_a_los_puntos_de_atencion_al_usuario_casas_operativas_y_cajeros_", "label": "Accesibilidad f\u00edsica en casas operativas", "shape": "dot", "size": 12, "title": "\u003cb\u003eAccesibilidad f\u00edsica en casas operativas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La accesibilidad a los puntos de atenci\u00f3n al usuario (casas operativas y cajeros autom\u00e1ticos) deber\u00e1 respetar caracter\u00edsticas apropiadas para cada uno de estos grupos poblacionales que implican, entre otras medidas, la eliminaci\u00f3n de escalones, desniveles o cualquier otra clase de obst\u00e1culos f\u00edsicos o la instalaci\u00f3n de rampas, el mantenimiento de espacios amplios entre puestos de atenci\u00f3n, la incorporaci\u00f3n de elementos que orienten o faciliten la circulaci\u00f3n.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_toda_renovacion_de_equipos_y_o_de_instalaciones_en_los_puntos_de_atencion_al_usu", "label": "Contemplaci\u00f3n de accesibilidad en renovaci\u00f3n de equipos", "shape": "dot", "size": 12, "title": "\u003cb\u003eContemplaci\u00f3n de accesibilidad en renovaci\u00f3n de equipos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Toda renovaci\u00f3n de equipos y/o de instalaciones en los puntos de atenci\u00f3n al usuario del sujeto obligado deber\u00e1 contemplar previamente que las necesidades de los usuarios de servicios financieros que encuadran en estos segmentos poblacionales se encuentren suficientemente atendidas.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_entidades_financieras_los_pspcp_y_los_psi_deberan_observar_en_lo_pertinente_", "label": "Cumplimiento de pautas de accesibilidad web", "shape": "dot", "size": 12, "title": "\u003cb\u003eCumplimiento de pautas de accesibilidad web\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las entidades financieras, los PSPCP y los PSI deber\u00e1n observar, en lo pertinente, lo previsto en la Disposici\u00f3n N\u00b0 6/19 de la Oficina Nacional de Tecnolog\u00eda de la Informaci\u00f3n sobre las Pautas de accesibilidad para el contenido Web 2.0 y los \"Criterios de conformidad\", a los efectos de que las p\u00e1ginas de Internet \u2013inclusive el \"home banking\u2013 faciliten la accesibilidad de los usuarios con discapacidad.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.2. Casos especiales."}, {"color": "#9b59b6", "font": {"color": "#222"}, "id": "Comunicacion_a_5928", "label": "Com. A 5928", "shape": "dot", "size": 12, "title": "\u003cb\u003eCom. A 5928\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eComunicacion\u003c/i\u003e\u003cbr/\u003ecodigo: A-5928\u003cbr/\u003etipo: A\u003cbr/\u003enumero: 5928\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. \u201cA\u201d 5388 S/Com. \u201cA\u201d 5460."}, {"color": "#9b59b6", "font": {"color": "#222"}, "id": "Comunicacion_a_6068", "label": "Com. A 6068", "shape": "dot", "size": 12, "title": "\u003cb\u003eCom. A 6068\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eComunicacion\u003c/i\u003e\u003cbr/\u003ecodigo: A-6068\u003cbr/\u003etipo: A\u003cbr/\u003enumero: 6068\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. \u201cA\u201d 5388 S/Com. \u201cA\u201d 5460."}, {"color": "#9b59b6", "font": {"color": "#222"}, "id": "Comunicacion_a_6123", "label": "Com. A 6123", "shape es_financieras_ante_requerimientos_de_apertura_de_cuentas_a_la_vista_", "label": "Ofrecer caja de ahorros en pesos", "shape": "dot", "size": 12, "title": "\u003cb\u003eOfrecer caja de ahorros en pesos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las entidades financieras, ante requerimientos de apertura de cuentas a la vista, deber\u00e1n ofrecer la Caja de ahorros en pesos con las prestaciones previstas en el punto 1.8.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_conservar_constancia_del_ofrecimiento_expreso_de_caja_de_ahorros", "label": "Conservar constancia del ofrecimiento", "shape": "dot", "size": 12, "title": "\u003cb\u003eConservar constancia del ofrecimiento\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Conservar constancia del ofrecimiento expreso de caja de ahorros\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_los_contratos_deben_ser_de_clara_redaccion_y_con_tamano_de_tipografia_minimo_de_", "label": "Tama\u00f1o m\u00ednimo tipograf\u00eda contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eTama\u00f1o m\u00ednimo tipograf\u00eda contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Los contratos deben ser de clara redacci\u00f3n y con tama\u00f1o de tipograf\u00eda m\u00ednimo de 1,8 mil\u00edmetros de altura.\u003cbr/\u003etipo: limite_cuantitativo\u003cbr/\u003eumbral: 1,8 mil\u00edmetros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_en_el_acto_de_la_contratacion_debe_entregarse_uno_al_usuario_de_servicios_financ", "label": "Entregar ejemplar suscripto al usuario", "shape": "dot", "size": 12, "title": "\u003cb\u003eEntregar ejemplar suscripto al usuario\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: En el acto de la contrataci\u00f3n debe entregarse uno al usuario de servicios financieros debidamente suscripto por el sujeto obligado.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cuando_se_trate_de_solicitudes_de_productos_o_servicios_que_seran_sometidas_a_la", "label": "Entregar formularios intervenidos como constancia", "shape": "dot", "size": 12, "title": "\u003cb\u003eEntregar formularios intervenidos como constancia\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cuando se trate de solicitudes de productos o servicios que ser\u00e1n sometidas a la aprobaci\u00f3n posterior, deber\u00e1 entregarse al usuario un ejemplar de la totalidad de los formularios que firma en ese acto, intervenido por el sujeto obligado en car\u00e1cter de constancia de recepci\u00f3n.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_sujeto_obligado_le_debera_notificar_conservando_constancia_de_ello_que_una_ve", "label": "Notificar entrega de contrato suscripto", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificar entrega de contrato suscripto\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El sujeto obligado le deber\u00e1 notificar \u2013conservando constancia de ello\u2013 que una vez aprobada la solicitud se le proporcionar\u00e1 \u2013dentro de los diez d\u00edas h\u00e1biles contados a partir de la fecha de su aprobaci\u00f3n o de la disponibilidad efectiva del producto o servicio, lo que suceda \u00faltimo\u2013 el contrato con la firma autorizada del sujeto obligado.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003eplazo: diez d\u00edas h\u00e1biles\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_las_clausulas_del_contrato_deben_ser_comprensibles_y_autosuficientes_correspondi", "label": "Cl\u00e1usulas deben ser comprensibles y autosuficientes", "shape": "dot", "size": 12, "title": "\u003cb\u003eCl\u00e1usulas deben ser comprensibles y autosuficientes\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Las cl\u00e1usulas del contrato deben ser comprensibles y autosuficientes, correspondiendo tener por no escritas las que remitan a textos o documentos que no se proporcionen al usuario de servicios financieros en forma simult\u00e1nea al momento de la firma del contrato.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_descripcion_y_especificacion_completa_del_producto_y_o_servicio_debe_constar_", "label": "Incluir descripci\u00f3n del producto en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir descripci\u00f3n del producto en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La descripci\u00f3n y especificaci\u00f3n completa del producto y/o servicio debe constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_razon_social_cuit_y_domicilio_legal_del_sujeto_obligado_debe_constar_en_el_co", "label": "Incluir datos del sujeto obligado en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir datos del sujeto obligado en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La raz\u00f3n social, CUIT y domicilio legal del sujeto obligado debe constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_identificacion_del_usuario_de_servicios_financieros_nombres_y_apellidos_completo", "label": "Incluir identificaci\u00f3n del usuario en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir identificaci\u00f3n del usuario en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Identificaci\u00f3n del usuario de servicios financieros (nombres y apellidos completos, tipo y n\u00famero de documento, CUIT/CUIL/CDI y domicilio para personas humanas; raz\u00f3n social, CUIT y domicilio legal para personas jur\u00eddicas).\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_comisiones_y_cargos_asi_como_los_terminos_y_condiciones_y_demas_circunstanci", "label": "Incluir comisiones y cargos en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir comisiones y cargos en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las comisiones y cargos, as\u00ed como los t\u00e9rminos y condiciones y dem\u00e1s circunstancias conforme a las cuales hayan sido ofrecidos, publicitados y convenidos deben constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_en_el_caso_de_prestamos_hipotecarios_en_pesos_para_la_compra_de_vivienda_que_per", "label": "Informar comisi\u00f3n pr\u00e9stamo hipotecario d\u00f3lar MEP", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar comisi\u00f3n pr\u00e9stamo hipotecario d\u00f3lar MEP\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: En el caso de pr\u00e9stamos hipotecarios en pesos para la compra de vivienda que permitan aplicar esos fondos al pago de los inmuebles en moneda extranjera a trav\u00e9s de una operaci\u00f3n de compraventa de t\u00edtulos valores con liquidaci\u00f3n en moneda extranjera (d\u00f3lar MEP), se deber\u00e1 informar en forma clara y precisa su respectiva comisi\u00f3n.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_clausula_de_revocacion_en_donde_se_indique_que_el_usuario_tiene_derecho_a_revoca", "label": "Incluir cl\u00e1usula de revocaci\u00f3n en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir cl\u00e1usula de revocaci\u00f3n en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cl\u00e1usula de revocaci\u00f3n en donde se indique que el usuario tiene derecho a revocar la aceptaci\u00f3n del producto o servicio dentro del plazo de diez (10) d\u00edas h\u00e1biles contados a partir de la fecha de recibido el contrato o de la disponibilidad efectiva del producto o servicio.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_la_revocacion_sera_sin_costo_ni_responsabilidad_alguna_para_el_usuario_en_la_med", "label": "Revocaci\u00f3n sin costo ni responsabilidad", "shape": "dot", "size": 12, "title": "\u003cb\u003eRevocaci\u00f3n sin costo ni responsabilidad\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: La revocaci\u00f3n ser\u00e1 sin costo ni responsabilidad alguna para el usuario en la medida que no haya hecho uso del respectivo producto o servicio y que, en el caso de que lo haya utilizado, s\u00f3lo se le cobrar\u00e1n las comisiones y cargos previstos para la prestaci\u00f3n, proporcionados al tiempo de utilizaci\u00f3n.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_facultad_de_revocacion_debe_ser_informada_al_usuario_en_todo_documento_que_le", "label": "Informar derecho de revocaci\u00f3n en documentos", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar derecho de revocaci\u00f3n en documentos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La facultad de revocaci\u00f3n debe ser informada al usuario en todo documento que le sea presentado con motivo de la oferta y/o contrataci\u00f3n del producto o servicio.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#f39c12", "font": {"color": "#222"}, "id": "Excepcion_lo_previsto_en_este_punto_no_aplica_a_las_operaciones_de_captacion_de_fondos_que", "label": "No aplica revocaci\u00f3n a dep\u00f3sitos a plazo", "shape": "dot", "size": 12, "title": "\u003cb\u003eNo aplica revocaci\u00f3n a dep\u00f3sitos a plazo\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eExcepcion\u003c/i\u003e\u003cbr/\u003edescripcion: Lo previsto en este punto no aplica a las operaciones de captaci\u00f3n de fondos que realizan las entidades financieras en el marco del TO sobre Dep\u00f3sitos e Inversiones a Plazo.\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_derecho_del_usuario_de_efectuar_en_cualquier_momento_del_plazo_del_credito_la", "label": "Incluir derecho de precancelaci\u00f3n en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir derecho de precancelaci\u00f3n en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El derecho del usuario de efectuar, en cualquier momento del plazo del cr\u00e9dito, la precancelaci\u00f3n total o precancelaciones parciales debe constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_derecho_del_usuario_de_realizar_operaciones_por_ventanilla_sin_restricciones_", "label": "Incluir derecho de operaciones por ventanilla", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir derecho de operaciones por ventanilla\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El derecho del usuario de realizar operaciones por ventanilla, sin restricciones de tipo de operaci\u00f3n ni de monto m\u00ednimo, debe constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_contrato_debe_incluir_la_leyenda_usted_puede_consultar_el_regimen_de_transpar", "label": "Incluir leyenda sobre R\u00e9gimen de Transparencia", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir leyenda sobre R\u00e9gimen de Transparencia\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El contrato debe incluir la leyenda: \u0027Usted puede consultar el \"R\u00e9gimen de Transparencia\" elaborado por el BCRA sobre la base de la informaci\u00f3n proporcionada por los sujetos obligados a fin de comparar los costos, caracter\u00edsticas y requisitos de los productos y servicios financieros.\u0027\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_derecho_de_solicitar_la_apertura_de_la_caja_de_ahorros_en_pesos_con_las_prest", "label": "Incluir derecho solicitar caja ahorros gratuita", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir derecho solicitar caja ahorros gratuita\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El derecho de solicitar la apertura de la Caja de Ahorros en pesos con las prestaciones previstas en el punto 1.8. del TO sobre Dep\u00f3sitos de Ahorro, Cuenta Sueldo y Especiales, las cuales ser\u00e1n gratuitas, debe constar en el contrato.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_contratacion_de_producto_financiero", "label": "Contrataci\u00f3n de productos multiproducto", "shape": "dot", "size": 12, "title": "\u003cb\u003eContrataci\u00f3n de productos multiproducto\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: contrataci\u00f3n de producto financiero\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_los_contratos_multiproducto_se_admitiran_en_la_medida_en_que_las_secciones_corre", "label": "Secciones multiproducto deben ser escindibles", "shape": "dot", "size": 12, "title": "\u003cb\u003eSecciones multiproducto deben ser escindibles\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Los contratos multiproducto se admitir\u00e1n en la medida en que las secciones correspondientes a cada producto puedan escindirse en contratos individuales aut\u00f3nomos, de manera tal que cada usuario pueda adherir solamente a el/los producto/s que efectivamente le interese/n.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_la_revocacion_o_rescision_de_un_producto_o_servicio_integrante_de_un_contrato_mu", "label": "P\u00e9rdida beneficios revocaci\u00f3n multiproducto", "shape": "dot", "size": 12, "title": "\u003cb\u003eP\u00e9rdida beneficios revocaci\u00f3n multiproducto\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: La revocaci\u00f3n o rescisi\u00f3n de un producto o servicio integrante de un contrato multiproducto podr\u00e1 implicar la p\u00e9rdida de beneficios y/o la baja de los restantes productos o servicios asociados, excepto cajas de ahorros en pesos.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#f39c12", "font": {"color": "#222"}, "id": "Excepcion_cajas_de_ahorros_en_pesos_cuando_se_encuentren_abiertas_estan_exceptuadas_de_la_", "label": "Cajas ahorros exceptuadas de multiproducto", "shape": "dot", "size": 12, "title": "\u003cb\u003eCajas ahorros exceptuadas de multiproducto\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eExcepcion\u003c/i\u003e\u003cbr/\u003edescripcion: Cajas de ahorros en pesos \u2013cuando se encuentren abiertas\u2013 est\u00e1n exceptuadas de la p\u00e9rdida de beneficios, dado que \u00e9stas no integran los paquetes multiproducto.\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cuando_se_genere_un_incremento_en_el_costo_total_de_los_restantes_productos_o_se", "label": "Informar incremento costo multiproducto", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar incremento costo multiproducto\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cuando se genere un incremento en el costo total de los restantes productos o servicios por revocaci\u00f3n, dicha circunstancia deber\u00e1 ser informada previamente al usuario indicando los medios disponibles para efectuar la consulta de los nuevos valores.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#9b59b6", "font": {"color": "#222"}, "id": "Comunicacion_a_8203", "label": "Com. A 8203", "shape": "dot", "size": 12, "title": "\u003cb\u003eCom. A 8203\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eComunicacion\u003c/i\u003e\u003cbr/\u003ecodigo: A-8203\u003cbr/\u003etipo: A\u003cbr/\u003enumero: 8203\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 1)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_contratacion", "label": "Contrataci\u00f3n de servicios financieros", "shape": "dot", "size": 12, "title": "\u003cb\u003eContrataci\u00f3n de servicios financieros\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/  "shape": "dot", "size": 12, "title": "\u003cb\u003eCargos no superiores a costo de terceros\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: El importe de los cargos que el sujeto obligado transfiera a los usuarios no podr\u00e1 ser superior al que el tercero prestador perciba de particulares, sin intermediarios y en similares condiciones\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 2)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_en_el_caso_de_precancelacion_total_no_se_admitira_la_aplicacion_de_comisiones_cu", "label": "Precancelaci\u00f3n sin comisiones tras plazo m\u00ednimo", "shape": "dot", "size": 12, "title": "\u003cb\u003ePrecancelaci\u00f3n sin comisiones tras plazo m\u00ednimo\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: En el caso de precancelaci\u00f3n total, no se admitir\u00e1 la aplicaci\u00f3n de comisiones cuando al momento de efectuarla haya transcurrido al menos la cuarta parte del plazo original de la financiaci\u00f3n o 180 d\u00edas corridos desde su otorgamiento\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 2)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_corresponde_el_cobro_a_los_usuarios_de_conceptos_que_deriven_de_la_prestacion", "label": "No cobro de comisiones duplicadas", "shape": "dot", "size": 12, "title": "\u003cb\u003eNo cobro de comisiones duplicadas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No corresponde el cobro a los usuarios de conceptos que deriven de la prest comisiones_y_o_cargos_al_usuario_por_servicios_f", "label": "Prohibici\u00f3n de comisiones por servicios no solicitados", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de comisiones por servicios no solicitados\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: En ning\u00fan caso podr\u00e1n aplicarse comisiones y/o cargos al usuario por servicios financieros que no hayan sido solicitados, pactados y/o autorizados por \u00e9l y, aun cuando habiendo sido solicitados, pactados y/o autorizados por \u00e9ste e informados por el sujeto obligado al usuario, no se hayan prestado de manera efectiva.\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_podran_aplicarse_comisiones_ni_cargos_por_operaciones_efectuadas_por_ventanil", "label": "Prohibici\u00f3n de comisiones por operaciones en ventanilla", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de comisiones por operaciones en ventanilla\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No podr\u00e1n aplicarse comisiones ni cargos por operaciones efectuadas por ventanilla por los usuarios de servicios financieros que sean personas humanas.\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_podran_aplicarse_comisiones_ni_cargos_por_depositos_de_efectivo_en_pesos_en_c", "label": "Prohibici\u00f3n de comisiones por dep\u00f3sitos de efectivo a Mipyme", "shape": "dot", "size": 12, "title": "\u0 e_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_usuario_de_servicios_financieros_debe_ser_notificado_de_las_modificaciones_qu", "label": "Notificar cambios de condiciones", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificar cambios de condiciones\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El usuario de servicios financieros debe ser notificado de las modificaciones que aplicar\u00e1 el sujeto obligado con una antelaci\u00f3n m\u00ednima de sesenta (60) d\u00edas corridos a su entrada en vigencia.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003eplazo: 60 d\u00edas corridos\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_notificaciones_por_cambios_de_condiciones_pactadas_seran_en_todos_los_casos_", "label": "Notificaciones de cambios deben ser gratuitas", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificaciones de cambios deben ser gratuitas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las notificaciones por cambios de condiciones pactadas ser\u00e1n en todos los casos gratuitas para el usuario de servicios financieros.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_notificaciones_deberan_efectuarse_mediante_documento_escrito_dirigido_al_dom", "label": "Enviar notificaciones por escrito o electr\u00f3nicamente", "shape": "dot", "size": 12, "title": "\u003cb\u003eEnviar notificaciones por escrito o electr\u00f3nicamente\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las notificaciones deber\u00e1n efectuarse mediante documento escrito dirigido al domicilio real del usuario de servicios financieros o por v\u00eda electr\u00f3nica. En este \u00faltimo caso, la notificaci\u00f3n deber\u00e1 ser clara, de f\u00e1cil acceso para el usuario e incluir la fecha de emisi\u00f3n.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_en_el_cuerpo_de_las_notificaciones_deberan_incluirse_la_leyenda_usted_podra_opta", "label": "Incluir leyendas de derecho a rescisi\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir leyendas de derecho a rescisi\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: En el cuerpo de las notificaciones deber\u00e1n incluirse la leyenda: \u0027Usted podr\u00e1 optar por rescindir el contrato en cualquier momento antes de la entrada en vigencia del cambio y sin cargo alguno, sin perjuicio de que deber\u00e1 cumplir las obligaciones pendientes a su cargo\u0027.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_cambio_de_condiciones", "label": "Modificaci\u00f3n de condiciones del contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eModificaci\u00f3n de condiciones del contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: cambio de condiciones\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_la_modificacion_no_debe_alterar_el_objeto_del_contrato_ni_importar_un_desmedro_r", "label": "Modificaci\u00f3n no altera objeto del contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eModificaci\u00f3n no altera objeto del contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: La modificaci\u00f3n no debe alterar el objeto del contrato ni importar un desmedro respecto de los productos o servicios contratados.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#f39c12", "font": {"color": "#222"}, "id": "Excepcion_las_modificaciones_que_resulten_economicamente_mas_beneficiosas_para_el_usuario_", "label": "Excepci\u00f3n para modificaciones beneficiosas", "shape": "dot", "size": 12, "title": "\u003cb\u003eExcepci\u00f3n para modificaciones beneficiosas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eExcepcion\u003c/i\u003e\u003cbr/\u003edescripcion: Las modificaciones que resulten econ\u00f3micamente m\u00e1s beneficiosas para el usuario por una reducci\u00f3n de los valores pactados no requieren notificaci\u00f3n anticipada.\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_la_limitacion_de_comisiones_por_ventanilla_tambien_alcanza_en_las_casas_operativ", "label": "Limite de alcance de movimientos en otras sucursales", "shape": "dot", "size": 12, "title": "\u003cb\u003eLimite de alcance de movimientos en otras sucursales\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: La limitaci\u00f3n de comisiones por ventanilla tambi\u00e9n alcanza, en las casas operativas distintas a aquella en la cual est\u00e9 abierta la cuenta, a los movimientos de fondos en efectivo en pesos (dep\u00f3sitos y/o extracciones) y a la recepci\u00f3n de dep\u00f3sitos de cheques efectuados por cuenta propia y/o de terceros.\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 3)"}, {"color": "#3498db", "font": {"color": "#222"}, "id": "EntidadFinanciera_empresa_no_financiera_emisora_de_tarjeta", "label": "Empresas no financieras emisoras de tarjetas", "shape": "dot", "size": 18, "title": "\u003cb\u003eEmpresas no financieras emisoras de tarjetas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eEntidadFinanciera\u003c/i\u003e\u003cbr/\u003ecategoria: empresa no financiera emisora de tarjetas de cr\u00e9dito\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_cobro_de_tasas_de_interes", "label": "Cobro de tasas de inter\u00e9s", "shape": "dot", "size": 12, "title": "\u003cb\u003eCobro de tasas de inter\u00e9s\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: cobro de tasas de inter\u00e9s\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)" 003c/i\u003e\u003cbr/\u003etipo: bloqueo de productos y servicios\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cuando_se_modifique_el_valor_de_las_comisiones_el_cuerpo_de_las_notificaciones_d", "label": "Exhibir cuadro comparativo de comisiones", "shape": "dot", "size": 12, "title": "\u003cb\u003eExhibir cuadro comparativo de comisiones\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cuando se modifique el valor de las comisiones, el cuerpo de las notificaciones deber\u00e1 exhibir un cuadro comparativo para esos importes que ser\u00e1 elaborado y oportunamente puesto a disposici\u00f3n por la Superintendencia de Entidades Financieras y Cambiarias (SEFYC)\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_todo_importe_cobrado_o_adeudado_de_cualquier_forma_al_usuario_por_conceptos_como", "label": "Reintegro de importes cobrados indebidamente", "shape": "dot", "size": 12, "title": "\u003cb\u003eReintegro de importes cobrados indebidamente\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Todo importe cobrado o adeudado de cualquier forma al usuario por conceptos como tasas de inter\u00e9s, comisiones y/o cargos sin cumplimiento de lo previsto, deber\u00e1 serle reintegrado dentro de los diez (10) d\u00edas h\u00e1biles siguientes al momento de la presentaci\u00f3n del reclamo ante el sujeto obligado, o los cinco (5) d\u00edas h\u00e1biles siguientes al momento de constatarse tal circunstancia por el sujeto obligado o por la fiscalizaci\u00f3n de la SEFYC\u003cbr/\u003etipo: otra\u003cbr/\u003eplazo: 10 d\u00edas h\u00e1biles o 5 d\u00edas h\u00e1biles seg\u00fan corresponda\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_sujeto_obligado_debera_aplicar_1_5_veces_la_tasa_promedio_correspondiente_al_", "label": "Aplicar intereses compensatorios en reintegros", "shape": "dot", "size": 12, "title": "\u003cb\u003eAplicar intereses compensatorios en reintegros\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El sujeto obligado deber\u00e1 aplicar 1,5 veces la tasa promedio correspondiente al per\u00edodo comprendido entre el momento en que la diferencia hubiera sido exigible y el de su efectiva cancelaci\u00f3n, computado a partir de la encuesta diaria de tasas de inter\u00e9s de dep\u00f3sitos a plazo fijo de 30 a 59 d\u00edas\u003cbr/\u003etipo: calculo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cuando_el_usuario_posea_en_la_entidad_financiera_obligada_una_cuenta_a_la_vista_", "label": "Acreditar reintegro en cuenta a la vista", "shape": "dot", "size": 12, "title": "\u003cb\u003eAcreditar reintegro en cuenta a la vista\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cuando el usuario posea en la entidad financiera obligada una cuenta a la vista que se halle abierta a su nombre, \u00e9sta deber\u00e1 acreditar ese importe en dicha cuenta en forma autom\u00e1tica sin necesidad de requerimiento expreso\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_debera_notificarse_la_acreditacion_del_reintegro_o_su_puesta_a_disposicion_media", "label": "Notificar acreditaci\u00f3n del reintegro", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificar acreditaci\u00f3n del reintegro\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Deber\u00e1 notificarse la acreditaci\u00f3n del reintegro o su puesta a disposici\u00f3n mediante aviso efectuado a trav\u00e9s de medios electr\u00f3nicos (cajeros autom\u00e1ticos, banca por Internet, etc.) y/o servicios telef\u00f3nicos (mensajes de texto y/o voz), y mediante documento escrito dirigido a su domicilio o a su correo electr\u00f3nico\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_sujeto_obligado_debera_verificar_si_situaciones_que_generan_la_obligacion_de_", "label": "Verificar situaciones de reintegro en usuarios", "shape": "dot", "size": 12, "title": "\u003cb\u003eVerificar situaciones de reintegro en usuarios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El sujeto obligado deber\u00e1 verificar si situaciones que generan la obligaci\u00f3n de reintegros ha ocurrido respecto de los usuarios que se encuentren en la misma situaci\u00f3n y, de corresponder, proceder a su reintegro seg\u00fan el procedimiento previsto, notificando de tal circunstancia y resultados a su Responsable de Atenci\u00f3n al Usuario de Servicios Financieros\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_se_puede_cobrar_tasas_de_interes_comisiones_y_o_cargos_sin_el_cumplimiento_de", "label": "Prohibici\u00f3n cobro sin cumplimiento de requisitos", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n cobro sin cumplimiento de requisitos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No se puede cobrar tasas de inter\u00e9s, comisiones y/o cargos sin el cumplimiento de lo previsto en los puntos 2.3.2. a 2.3.4.\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_se_pueden_cobrar_cargos_en_exceso_de_los_costos_de_los_servicios_que_terceros", "label": "Prohibici\u00f3n cobro en exceso de costos", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n cobro en exceso de costos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No se pueden cobrar cargos en exceso de los costos de los servicios que terceros les cobraron a los sujetos obligados\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_se_pueden_cobrar_comisiones_en_exceso_de_las_maximas_fijadas_por_el_bcra", "label": "L\u00edmite m\u00e1ximo de comisiones", "shape": "dot", "size": 12, "title": "\u003cb\u003eL\u00edmite m\u00e1ximo de comisiones\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No se pueden cobrar comisiones en exceso de las m\u00e1ximas fijadas por el BCRA\u003cbr/\u003etipo: limite_cuantitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_se_puede_incumplir_el_nivel_de_la_tasa_de_interes_maxima_aplicable_a_financia", "label": "Prohibici\u00f3n tasa inter\u00e9s m\u00e1xima en tarjetas", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n tasa inter\u00e9s m\u00e1xima en tarjetas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No se puede incumplir el nivel de la tasa de inter\u00e9s m\u00e1xima aplicable a financiaciones vinculadas a tarjetas de cr\u00e9dito\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_no_se_pueden_cobrar_importes_en_exceso_de_lo_oportunamente_pactado_entre_el_usua", "label": "Prohibici\u00f3n cobro excepto lo pactado", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n cobro excepto lo pactado\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: No se pueden cobrar importes en exceso de lo oportunamente pactado entre el usuario y el sujeto obligado\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_se_prohiben_otros_importes_generados_en_forma_impropia_por_su_naturaleza_tales_c", "label": "Prohibici\u00f3n generaci\u00f3n impropia de importes", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n generaci\u00f3n impropia de importes\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Se proh\u00edben otros importes generados en forma impropia por su naturaleza, tales como intereses compensatorios por saldos deudores generados en cuentas de dep\u00f3sito distintas de la cuenta corriente bancaria\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_se_prohibe_la_liquidacion_en_forma_incorrecta_de_promociones_descuentos_u_otro_t", "label": "Prohibici\u00f3n liquidaci\u00f3n incorrecta de beneficios", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n liquidaci\u00f3n incorrecta de beneficios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Se proh\u00edbe la liquidaci\u00f3n en forma incorrecta de promociones, descuentos u otro tipo de beneficios que no se ajusten a los t\u00e9rminos, condiciones y/o modalidades que hubieran sido ofrecidos, publicitados o convenidos\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 4)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_informarle_al_usuario_la_situacion_mediante_el_empleo_de_alguno_de_los_medios_el", "label": "Informar situaci\u00f3n al usuario", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar situaci\u00f3n al usuario\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Informarle al usuario la situaci\u00f3n mediante el empleo de alguno de los medios electr\u00f3nicos de comunicaci\u00f3n disponibles \u2013tales como correo electr\u00f3nico o tel\u00e9fono\u2013 en el mismo d\u00eda de su efectiva aplicaci\u00f3n, indicando los motivos de la medida, as\u00ed como los canales disponibles para tramitar la rehabilitaci\u00f3n del producto/servicio\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003eplazo: mismo d\u00eda\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_posibilitar_la_rehabilitacion_de_los_productos_servicios_a_traves_de_alguno_de_l", "label": "Posibilitar rehabilitaci\u00f3n de productos", "shape": "dot", "size": 12, "title": "\u003cb\u003ePosibilitar rehabilitaci\u00f3n de productos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Posibilitar la rehabilitaci\u00f3n de los productos/servicios a trav\u00e9s de alguno de los medios electr\u00f3nicos de comunicaci\u00f3n que el sujeto obligado utilice para comunicarse con sus clientes y en forma presencial \u2013en cualquier sucursal\u2013\u003cbr/\u003etipo: otra\u003cbr/\u003eplazo: en cualquier momento\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_usuario_de_servicios_financieros_podra_solicitar_a_su_cargo_y_en_cualquier_mo", "label": "Proporcionar nuevas copias de documentaci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eProporcionar nuevas copias de documentaci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El usuario de servicios financieros podr\u00e1 solicitar \u2013a su cargo y en cualquier momento de la relaci\u00f3n de consumo\u2013 al sujeto obligado nuevas copias del/de el/los contrato/s vigente/s que lo vinculan con \u00e9l\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_en_los_contratos_celebrados_entre_el_usuario_de_servicios_financieros_y_los_suje", "label": "Prohibici\u00f3n de cl\u00e1usulas abusivas", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de cl\u00e1usulas abusivas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: En los contratos celebrados entre el usuario de servicios financieros y los sujetos obligados, se tendr\u00e1n por no escritas las cl\u00e1usulas que desnaturalicen las obligaciones del sujeto obligado, importen una renuncia o restricci\u00f3n a los derechos del usuario, por su contenido no sea razonable esperarlas, impongan obst\u00e1culos onerosos, coloquen al usuario en situaci\u00f3n desventajosa, transfieran responsabilidad a terceros, establezcan inversi\u00f3n de carga de prueba, permitan alterar tasas/comisiones/cargos unilateralmente\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_los_sujetos_obligados_no_podran_percibir_de_los_usuarios_ningun_tipo_de_comision", "label": "Prohibici\u00f3n de comisiones por seguros vida", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de comisiones por seguros vida\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Los sujetos obligados no podr\u00e1n percibir de los usuarios ning\u00fan tipo de comisi\u00f3n y/o cargo vinculado con seguros de vida sobre saldo deudor\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_los_sujetos_obligados_deberan_contratar_un_seguro_sobre_saldo_deudor_con_cobertu", "label": "Contratar seguro sobre saldo deudor", "shape": "dot", "size": 12, "title": "\u003cb\u003eContratar seguro sobre saldo deudor\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Los sujetos obligados deber\u00e1n contratar un seguro sobre saldo deudor con cobertura de fallecimiento e invalidez total permanente respecto de aquellas financiaciones otorgadas a personas humanas, o alternativamente, autoasegurar los riesgos derivados del fallecimiento e invalidez total permanente de los usuarios. En ambos casos, la cobertura deber\u00e1 extinguir totalmente el monto adeudado en caso de fallecimiento o invalidez total permanente del deudor\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_los_sujetos_obligados_deberan_ofrecer_a_los_usuarios_de_servicios_financieros_po", "label": "Ofrecer m\u00ednimo tres compa\u00f1\u00edas aseguradoras", "shape": "dot", "size": 12, "title": "\u003cb\u003eOfrecer m\u00ednimo tres compa\u00f1\u00edas aseguradoras\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Los sujetos obligados deber\u00e1n ofrecer a los usuarios de servicios financieros por lo menos tres compa\u00f1\u00edas aseguradoras no vinculadas entre s\u00ed entre las que deber\u00e1n poder optar, y conservar constancia del ejercicio de ese derecho por parte de dichos usuarios\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_a_los_fines_de_la_comparacion_el_sujeto_obligado_debera_informarle_al_usuario_la", "label": "Informar cobertura m\u00ednima del seguro", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar cobertura m\u00ednima del seguro\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: A los fines de la comparaci\u00f3n, el sujeto obligado deber\u00e1 informarle al usuario la cobertura m\u00ednima que debe prever el seguro en cuesti\u00f3n\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_el_cargo_que_el_sujeto_obligado_aplique_al_usuario_no_podra_ser_superior_al_que_", "label": "L\u00edmite de cargo por seguro accesorio", "shape": "dot", "size": 12, "title": "\u003cb\u003eL\u00edmite de cargo por seguro accesorio\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: El cargo que el sujeto obligado aplique al usuario no podr\u00e1 ser superior al que la compa\u00f1\u00eda de seguros elegida perciba por operaciones con particulares y sin la intervenci\u00f3n del sujeto obligado, concertadas en el lugar de contrataci\u00f3n o de domicilio del usuario\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_en_ningun_caso_los_sujetos_obligados_podran_registrar_retribuciones_ni_utilidade", "label": "Prohibici\u00f3n de retribuciones por seguros accesorios", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de retribuciones por seguros accesorios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: En ning\u00fan caso los sujetos obligados podr\u00e1n registrar retribuciones ni utilidades por los seguros que sus usuarios contraten con car\u00e1cter accesorio a un servicio financiero, independientemente de que se trate de una solicitud del usuario o de una condici\u00f3n establecida por el sujeto obligado para acceder al servicio financiero\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_los_sujetos_obligados_no_podran_percibir_de_los_usuarios_ningun_tipo_de_retribuc", "label": "Prohibici\u00f3n de retribuciones por seguros no accesorios", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de retribuciones por seguros no accesorios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Los sujetos obligados no podr\u00e1n percibir de los usuarios ning\u00fan tipo de retribuci\u00f3n \u2013comisi\u00f3n y/o cargo\u2013 adicional al premio determinado por la aseguradora, vinculada con la actividad de intermediaci\u00f3n de contratos de seguros generales\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_el_premio_que_el_sujeto_obligado_reciba_del_usuario_no_podra_ser_superior_al_imp", "label": "L\u00edmite de premio por seguro no accesorio", "shape": "dot", "size": 12, "title": "\u003cb\u003eL\u00edmite de premio por seguro no accesorio\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: El premio que el sujeto obligado reciba del usuario no podr\u00e1 ser superior al importe que la compa\u00f1\u00eda de seguros elegida perciba por operaciones con particulares y sin la intervenci\u00f3n del sujeto obligado\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_en_oportunidad_del_envio_de_resumenes_de_cuenta_el_sujeto_obligado_debera_inclui", "label": "Incluir leyenda en res\u00famenes de cuenta", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir leyenda en res\u00famenes de cuenta\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: En oportunidad del env\u00edo de res\u00famenes de cuenta, el sujeto obligado deber\u00e1 incluir \u2013seg\u00fan corresponda\u2013 las siguientes leyendas en un lugar visible y con letras de tama\u00f1o destacado, indicando que el usuario puede solicitar la Caja de ahorros en pesos con las prestaciones previstas\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003efrecuencia: en res\u00famenes de cuenta\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_los_derechos_y_o_facultades_reconocidos_al_usuario_por_estas_normas_no_pueden_en", "label": "Irrenunciabilidad de derechos del usuario", "shape": "dot", "size": 12, "title": "\u003cb\u003eIrrenunciabilidad de derechos del usuario\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Los derechos y/o facultades reconocidos al usuario por estas normas no pueden en ning\u00fan caso ser dispensados ni renunciados\u003cbr/\u003etipo: prohibicion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_denominacion_de_los_productos_o_servicios_en_las_solicitudes_contratos_sistem", "label": "Ajustar denominaci\u00f3n de productos/servicios", "shape": "dot", "size": 12, "title": "\u003cb\u003eAjustar denominaci\u00f3n de productos/servicios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La denominaci\u00f3n de los productos o servicios en las solicitudes, contratos, sistema de banca por Internet (home banking) y res\u00famenes de cuenta deber\u00e1 ajustarse a la prevista en las normas del BCRA (caja de ahorros en pesos, caja de ahorros en d\u00f3lares, cuenta corriente bancaria, cuenta sueldo/de la seguridad social, etc.)\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_inhabilitacion_de_productos_o_servicios_financieros", "label": "Inhabilitaci\u00f3n de productos/servicios", "shape": "dot", "size": 12, "title": "\u003cb\u003eInhabilitaci\u00f3n de productos/servicios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: inhabilitaci\u00f3n de productos o servicios financieros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_contratacion_de_seguros_sobre_saldo_deudor", "label": "Contrataci\u00f3n de seguros accesorios", "shape": "dot", "size": 12, "title": "\u003cb\u003eContrataci\u00f3n de seguros accesorios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: contrataci\u00f3n de seguros sobre saldo deudor\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_intermediacion_de_contratos_de_seguros", "label": "Intermediaci\u00f3n de seguros generales", "shape": "dot", "size": 12, "title": "\u003cb\u003eIntermediaci\u00f3n de seguros generales\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: intermediaci\u00f3n de contratos de seguros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 5)"}, {"color": "#3498db", "font": {"color": "#222"}, "id": "EntidadFinanciera_entidad_financiera_emisora_de_tarjeta_de_credito", "label": "Entidades financieras emisoras de tarjetas de cr\u00e9dito", "shape": "dot", "size": 18, "title": "\u003cb\u003eEntidades financieras emisoras de tarjetas de cr\u00e9dito\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eEntidadFinanciera\u003c/i\u003e\u003cbr/\u003ecategoria: emisor
