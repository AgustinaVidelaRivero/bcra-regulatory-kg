e1tico\u003cbr/\u003edescription: D\u00e9bito autom\u00e1tico del resumen de la tarjeta\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 6)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_se_aplicara_como_maximo_el_tipo_de_cambio_vendedor", "label": "L\u00edmite de tipo de cambio en cancelaci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eL\u00edmite de tipo de cambio en cancelaci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Se aplicar\u00e1 como m\u00e1ximo el tipo de cambio vendedor\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003edescription: Los consumos en d\u00f3lares de tarjetas de cr\u00e9dito podr\u00e1n ser cancelados en pesos, siendo aplicable como m\u00e1ximo en este caso el tipo de cambio vendedor\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 6)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_para_debito_automatico_aplicara_tipo_de_cambio_vendedor_para_operaciones_electro", "label": "Especificaci\u00f3n de tipo de cambio por canal", "shape": "dot", "size": 12, "title": "\u003cb\u003eEspecificaci\u00f3n de tipo de cambio por canal\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Para d\u00e9bito autom\u00e1tico aplicar\u00e1 tipo de cambio vendedor para operaciones electr\u00f3nicas\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003edescription: Si hubiera pactado el d\u00e9bito autom\u00e1tico del resumen de la tarjeta, aplicar\u00e1 el tipo de cambio vendedor para operaciones efectuadas a trav\u00e9s de medios electr\u00f3nicos de pago del cierre del mismo d\u00eda h\u00e1bil del pago\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 6)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_publicacion_del_tipo_de_cambio_vendedor_por_canales_electronicos", "label": "Publicaci\u00f3n de tipo de cambio vendedor", "shape": "dot", "size": 12, "title": "\u003cb\u003ePublicaci\u00f3n de tipo de cambio vendedor\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Publicaci\u00f3n del tipo de cambio vendedor por canales electr\u00f3nicos\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003edescription: Se debe publicar el tipo de cambio vendedor por canales electr\u00f3nicos el mismo d\u00eda h\u00e1bil de la fecha de pago, o el h\u00e1bil inmediato anterior cuando el pago se efect\u00fae un d\u00eda inh\u00e1bil\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.3. Recaudos m\u00ednimos de la relaci\u00f3n de consumo. (parte 6)"}, {"color": "#3498db", "font": {"color": "#222"}, "id": "EntidadFinanciera_casa_operativa", "label": "Casas operativas", "shape": "dot", "size": 18, "title": "\u003cb\u003eCasas operativas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eEntidadFinanciera\u003c/i\u003e\u003cbr/\u003ecategoria: casa operativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_presentacion_informativa", "label": "Entrega de detalle de caracter\u00edsticas de productos", "shape": "dot", "size": 12, "title": "\u003cb\u003eEntrega de detalle de caracter\u00edsticas de productos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: presentaci\u00f3n informativa\u003cbr/\u003edescription: Entrega a los usuarios de servicios financieros un detalle con las caracter\u00edsticas de los productos y servicios que ofrecen, precisando especialmente la totalidad de las comisiones y cargos asociados a ellos\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_comunicacion_comercial", "label": "Publicidad de productos y servicios", "shape": "dot", "size": 12, "title": "\u003cb\u003ePublicidad de productos y servicios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: comunicaci\u00f3n comercial\u003cbr/\u003edescription: Toda publicidad que realicen de sus productos y/o servicios, independientemente del medio utilizado e incluso cuando se dirija a personas humanas que no revistan el car\u00e1cter de usuarias de servicios financieros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_prohibicion_de_practicas_estereotipadas_en_publicidad", "label": "Prohibici\u00f3n de pr\u00e1cticas estereotipadas en publicidad", "shape": "dot", "size": 12, "title": "\u003cb\u003eProhibici\u00f3n de pr\u00e1cticas estereotipadas en publicidad\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003etipo: prohibicion\u003cbr/\u003edescription: Los sujetos obligados deber\u00e1n evitar pr\u00e1cticas o acciones que reflejen o promuevan visiones estereotipadas y jerarquizantes de los g\u00e9neros, androcentrismo, lenguaje sexista, violencia medi\u00e1tica y/o simb\u00f3lica contra mujeres y personas LGBTTIQ+. Entre otras, deber\u00e1n evitar la condescendencia masculina (mansplaining), utilizar la imagen de la mujer como mero objeto desvinculado del producto que se pretende promocionar o asociada a comportamientos estereotipados, o reproducir mensajes homof\u00f3bicos, lesbof\u00f3bicos y transf\u00f3bicos\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_dar_cumplimiento_a_condiciones_de_publicidad", "label": "Dar cumplimiento a condiciones de publicidad", "shape": "dot", "size": 12, "title": "\u003cb\u003eDar cumplimiento a condiciones de publicidad\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003etipo: otra\u003cbr/\u003edescription: Las entidades financieras, las empresas no financieras emisoras de tarjetas de cr\u00e9dito y los otros proveedores no financieros de cr\u00e9dito deber\u00e1n dar cumplimiento a las siguientes condiciones en cuanto al acceso a la informaci\u00f3n por parte de los usuarios de servicios financieros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_entregar_detalle_de_caracteristicas_y_comisiones", "label": "Entregar detalle de caracter\u00edsticas y comisiones", "shape": "dot", "size": 12, "title": "\u003cb\u003eEntregar detalle de caracter\u00edsticas y comisiones\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003edescription: Todas las casas operativas de estos sujetos obligados deber\u00e1n entregar a los referidos usuarios de servicios financieros que lo soliciten un detalle con las caracter\u00edsticas de los productos y servicios que ofrecen, precisando especialmente la totalidad de las comisiones y cargos asociados a ellos\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_publicar_modelos_de_contrato_de_adhesion", "label": "Publicar modelos de contrato de adhesi\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003ePublicar modelos de contrato de adhesi\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003edescription: Deber\u00e1n publicar en su sitio de Internet institucional los modelos de contrato de adhesi\u00f3n de todos los productos y/o servicios ofrecidos, as\u00ed como toda otra condici\u00f3n general y/o particular de adhesi\u00f3n establecida mediante los que se instrumenten derechos y obligaciones vigentes con sus usuarios y las promociones y bonificaciones\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_garantizar_acceso_facil_a_informacion_en_sitio_web", "label": "Garantizar acceso f\u00e1cil a informaci\u00f3n en sitio web", "shape": "dot", "size": 12, "title": "\u003cb\u003eGarantizar acceso f\u00e1cil a informaci\u00f3n en sitio web\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003etipo: otra\u003cbr/\u003edescription: El acceso a la citada informaci\u00f3n deber\u00e1 ser f\u00e1cil y directo desde la p\u00e1gina de inicio de su sitio de Internet institucional a trav\u00e9s de un \u00fanico hiperv\u00ednculo y ocupar un lugar destacado, en cuanto a visibilidad y tama\u00f1o, en esa p\u00e1gina\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_entregar_copia_integra_de_instrumentos_contractuales", "label": "Entregar copia \u00edntegra de instrumentos contractuales", "shape": "dot", "size": 12, "title": "\u003cb\u003eEntregar copia \u00edntegra de instrumentos contractuales\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003edescription: En todos los casos se deber\u00e1 entregar a los usuarios de servicios financieros copia \u00edntegra de los instrumentos que suscriben al momento de solicitar productos o servicios financieros y habilitar, a trav\u00e9s del servicio de banca por Internet o, en su defecto, a trav\u00e9s de su sitio de Internet, la consulta y descarga del contrato suscripto y de las ofertas o promociones especiales\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.4. Publicidad de la informaci\u00f3n."}, {"color": "#3498db", "font": {"color": "#222"}, "id": "EntidadFinanciera_empresa_emisora_de_tarjeta", "label": "Empresas emisoras de tarjetas", "shape": "dot", "size": 18, "title": "\u003cb\u003eEmpresas emisoras de tarjetas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eEntidadFinanciera\u003c/i\u003e\u003cbr/\u003ecategoria: empresa emisora de tarjetas de cr\u00e9dito\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 2.5. Informaci\u00f3n al Banco Central de la Rep\u00fablica Argentina."}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_comercializacion_de_productos_y_servicios_financieros", "label": "Comercializaci\u00f3n de productos financieros", "shape": "dot", "size": 12, "title": "\u003cb\u003eComercializaci\u00f3n de productos financieros\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: comercializaci\u00f3n de productos y servicios financieros\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: ales\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eExcepcion\u003c/i\u003e\u003cbr/\u003edescripcion: Los requerimientos relacionados con situaciones que hubieren dado lugar a acciones legales \u2013judiciales o extrajudiciales\u2013 iniciadas por el sujeto obligado o por el usuario de servicios financieros, podr\u00e1n ser canalizados internamente a trav\u00e9s de otras \u00e1reas del sujeto obligado de acuerdo con el procedimiento que \u00e9ste establezca\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_aplicar_estas_disposiciones_asi_como_las_que_el_sujeto_obligado_establezca_en_ma", "label": "Aplicar disposiciones de atenci\u00f3n al usuario", "shape": "dot", "size": 12, "title": "\u003cb\u003eAplicar disposiciones de atenci\u00f3n al usuario\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Aplicar estas disposiciones as\u00ed como las que el sujeto obligado establezca en materia de servicio de atenci\u00f3n al usuario de servicios financieros en su manual de procedimiento\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_diseno_de_productos_y_servicios", "label": "Dise\u00f1o de nuevos productos y servicios", "shape": "dot", "size": 12, "title": "\u003cb\u003eDise\u00f1o de nuevos productos y servicios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: dise\u00f1o de productos y servicios\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font" df\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#e74c3c", "font": {"color": "#222"}, "id": "Restriccion_velar_por_el_cumplimiento_de_las_disposiciones_de_la_seccion_2_en_todos_los_punt", "label": "Cumplimiento de disposiciones Secci\u00f3n 2", "shape": "dot", "size": 12, "title": "\u003cb\u003eCumplimiento de disposiciones Secci\u00f3n 2\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eRestriccion\u003c/i\u003e\u003cbr/\u003edescripcion: Velar por el cumplimiento de las disposiciones de la Secci\u00f3n 2 en todos los puntos de atenci\u00f3n al usuario (casas operativas y cajeros autom\u00e1ticos) del sujeto obligado que representa\u003cbr/\u003etipo: limite_cualitativo\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#1abc9c", "font": {"color": "#222"}, "id": "Operacion_analisis_de_reclamos", "label": "An\u00e1lisis de causas de reclamos", "shape": "dot", "size": 12, "title": "\u003cb\u003eAn\u00e1lisis de causas de reclamos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eOperacion\u003c/i\u003e\u003cbr/\u003etipo: an\u00e1lisis de reclamos\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_dirigir_el_proceso_de_analisis_de_las_causas_generadoras_de_los_eventos_de_recla", "label": "Dirigir an\u00e1lisis de causas de reclamos", "shape": "dot", "size": 12, "title": "\u003cb\u003eDirigir an\u00e1lisis de causas de reclamos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Dirigir el proceso de an\u00e1lisis de las causas generadoras de los eventos de reclamos, est\u00e9n o no relacionados con la devoluci\u00f3n de importe prevista en el \u00faltimo p\u00e1rrafo del punto 2.3.5.1., de los que pueda inferirse la afectaci\u00f3n de un conjunto de usuarios, propendiendo a las correcciones que eviten que se originen nuevos casos\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_administrar_y_tener_actualizado_i_el_registro_centralizado_de_consultas_y_reclam", "label": "Administrar RCCR, RRI y RDJA", "shape": "dot", "size": 12, "title": "\u003cb\u003eAdministrar RCCR, RRI y RDJA\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Administrar y tener actualizado: (i) el Registro Centralizado de Consultas y Reclamos (RCCR) a que se refiere el punto 3.1.3.; (ii) el Registro de Reintegros de Importes (RRI) previsto en el punto 3.1.4.; y (iii) el Registro de Denuncias ante Instancias Judiciales y/o Administrativas de Defensa del Consumidor (RDJA) establecido en el punto 3.1.5.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_elaborar_y_elevar_al_directorio_o_autoridad_equivalente_en_el_caso_de_los_sujeto", "label": "Elevar reportes trimestrales sobre consultas y reclamos", "shape": "dot", "size": 12, "title": "\u003cb\u003eElevar reportes trimestrales sobre consultas y reclamos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Elaborar y elevar al Directorio o autoridad equivalente \u2013en el caso de los sujetos obligados no alcanzados por la obligaci\u00f3n prevista en el punto 3.2.1.1.\u2013 o al Directivo Responsable de Protecci\u00f3n de los Usuarios de Servicios Financieros o al Comit\u00e9 de Protecci\u00f3n de los Usuarios de Servicios Financieros \u2013seg\u00fan corresponda\u2013, con periodicidad como m\u00ednimo trimestral, un reporte acerca de: (i) las consultas y reclamos recibidos; (ii) las intervenciones requeridas por denuncias tramitadas ante las instancias judiciales y/o administrativas de defensa del consumidor que resulten competentes y (iii) los reintegros de importes realizados\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003eplazo: trimestral\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_reporte_consignara_segun_corresponda_un_desglose_por_los_siguientes_criterios", "label": "Incluir desglose y estad\u00edsticas en reportes", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncluir desglose y estad\u00edsticas en reportes\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El reporte consignar\u00e1, seg\u00fan corresponda, un desglose por los siguientes criterios: tipo de temas que los originan, cantidades, montos involucrados, los productos y casas involucradas y los plazos promedio de resoluci\u00f3n. Adem\u00e1s, deber\u00e1n contener estad\u00edsticas comparativas respecto de per\u00edodos anteriores y \u2013de corresponder\u2013 propuestas correctivas\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_cuando_la_envergadura_del_sujeto_obligado_y_o_la_naturaleza_y_complejidad_de_sus", "label": "Designar personal de representaci\u00f3n zonal", "shape": "dot", "size": 12, "title": "\u003cb\u003eDesignar personal de representaci\u00f3n zonal\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Cuando la envergadura del sujeto obligado y/o la naturaleza y complejidad de sus productos y procesos y/o la magnitud de sus operaciones lo justifiquen, los procedimientos internos deber\u00e1n contemplar la designaci\u00f3n, por casa o por regi\u00f3n, de personal con funciones de representaci\u00f3n del responsable de atenci\u00f3n al usuario de servicios financieros\u003cbr/\u003etipo: asignacion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_los_sujetos_obligados_deberan_explicitar_en_un_manual_de_procedimiento_los_pasos", "label": "Elaborar manual de procedimiento", "shape": "dot", "size": 12, "title": "\u003cb\u003eElaborar manual de procedimiento\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Los sujetos obligados deber\u00e1n explicitar en un manual de procedimiento los pasos y los recaudos que observar\u00e1n para la atenci\u00f3n de las consultas y reclamos de sus usuarios de servicios financieros\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_debera_ser_aprobado_por_el_directorio_o_autoridad_equivalente_del_sujeto_obligad", "label": "Aprobar manual por Directorio", "shape": "dot", "size": 12, "title": "\u003cb\u003eAprobar manual por Directorio\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Deber\u00e1 ser aprobado por el Directorio o autoridad equivalente del sujeto obligado, previa toma de conocimiento del Comit\u00e9 de Auditor\u00eda y, seg\u00fan corresponda, del Directivo Responsable de Protecci\u00f  se hayan otorgado al sujeto obligado mayores plazos para adecuarse normativamente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 2)"}, {"color": "#f39c12", "font": {"color": "#222"}, "id": "Excepcion_cuando_medien_causas_ajenas_al_sujeto_obligado_debidamente_justificadas", "label": "Causas ajenas justificadas", "shape": "dot", "size": 12, "title": "\u003cb\u003eCausas ajenas justificadas\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eExcepcion\u003c/i\u003e\u003cbr/\u003edescripcion: cuando medien causas ajenas al sujeto obligado debidamente justificadas\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.1. Requisitos m\u00ednimos. (parte 2)"}, {"color": "#9b59b6", "font": {"color": "#222"}, "id": "Comunicacion_a_7156", "label": "Com. A 7156", "shape": "dot", "size": 12, "title": "\u003cb\u003eCom. A 7156\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eComunicacion\u003c/i\u003e\u003cbr/\u003ecodigo: A-7156\u003cbr/\u003etipo: A\u003cbr/\u003enumero: 7156\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_las_entidades_financieras_las_empresas_no_financieras_emisoras_de_tarjetas_de_cr", "label": "Designar Directivo Responsable de Protecci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eDesignar Directivo Responsable de Protecci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Las entidades financieras, las empresas no financieras emisoras de tarjetas de cr\u00e9dito y/o compra y los otros proveedores no financieros de cr\u00e9dito deber\u00e1n designar a un miembro del Directorio o autoridad equivalente como Directivo Responsable de Protecci\u00f3n de los Usuarios de Servicios Financieros ante el BCRA.\u003cbr/\u003etipo: asignacion\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_directivo_responsable_debera_vigilar_el_adecuado_funcionamiento_de_los_proces", "label": "Vigilar funcionamiento de procesos de protecci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eVigilar funcionamiento de procesos de protecci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El Directivo Responsable deber\u00e1 vigilar el adecuado funcionamiento de los procesos relacionados con la protecci\u00f3n de los usuarios de los servicios financieros seg\u00fan las disposiciones establecidas en estas normas.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_contribuir_a_la_mejora_de_los_mencionados_procesos_los_controles_relacionados_y_", "label": "Contribuir mejora de procesos y controles", "shape": "dot", "size": 12, "title": "\u003cb\u003eContribuir mejora de procesos y controles\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Contribuir a la mejora de los mencionados procesos, los controles relacionados y el esquema de gesti\u00f3n de riesgo asociado con la protecci\u00f3n de los usuarios de servicios financieros, en coordinaci\u00f3n con las \u00e1reas de cumplimiento normativo, gesti\u00f3n de riesgo operativo y asuntos legales.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_proponer_al_directorio_o_autoridad_equivalente_a_los_funcionarios_para_el_desemp", "label": "Proponer funcionarios responsables de atenci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eProponer funcionarios responsables de atenci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Proponer al Directorio o autoridad equivalente a los funcionarios para el desempe\u00f1o de la funci\u00f3n de Responsable de atenci\u00f3n al usuario de servicios financieros.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_participar_en_el_proceso_de_definicion_y_aprobacion_de_nuevos_productos_y_servic", "label": "Participar en definici\u00f3n de productos y servicios", "shape": "dot", "size": 12, "title": "\u003cb\u003eParticipar en definici\u00f3n de productos y servicios\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Participar en el proceso de definici\u00f3n y aprobaci\u00f3n de nuevos productos y servicios y en la modificaci\u00f3n de los existentes, vigilando que se hayan considerado adecuadamente los derechos de los usuarios de servicios financieros.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_verificar_el_adecuado_funcionamiento_del_proceso_de_analisis_de_las_causas_gener", "label": "Verificar an\u00e1lisis de causas de reclamos", "shape": "dot", "size": 12, "title": "\u003cb\u003eVerificar an\u00e1lisis de causas de reclamos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Verificar el adecuado funcionamiento del proceso de an\u00e1lisis de las causas generadoras de los eventos de reclamos.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_evaluar_los_reportes_trimestrales_que_genere_el_responsable_de_atencion_al_usuar", "label": "Evaluar reportes trimestrales de atenci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eEvaluar reportes trimestrales de atenci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Evaluar los reportes trimestrales que genere el Responsable de atenci\u00f3n al usuario de servicios financieros, aprobar las propuestas correctivas y efectuar el seguimiento de su implementaci\u00f3n.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003efrecuencia: trimestral\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_evaluar_los_informes_emitidos_por_la_auditoria_interna_la_auditoria_externa_y_la", "label": "Evaluar informes de auditor\u00eda e indicaciones", "shape": "dot", "size": 12, "title": "\u003cb\u003eEvaluar informes de auditor\u00eda e indicaciones\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Evaluar los informes emitidos por la auditor\u00eda interna, la auditor\u00eda externa y las observaciones e indicaciones comunicadas por la SEFyC con relaci\u00f3n al proceso de protecci\u00f3n de los usuarios de servicios financieros, y velar por la ejecuci\u00f3n de las acciones tendientes a regularizar o minimizar las debilidades.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_velar_por_el_cumplimiento_de_los_requerimientos_informativos_del_bcra_que_son_ma", "label": "Velar por cumplimiento de requerimientos informativos", "shape": "dot", "size": 12, "title": "\u003cb\u003eVelar por cumplimiento de requerimientos informativos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Velar por el cumplimiento de los requerimientos informativos del BCRA que son materia de su incumbencia.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_elevar_al_directorio_o_autoridad_equivalente_como_minimo_trimestralmente_un_repo", "label": "Elevar reporte trimestral al Directorio", "shape": "dot", "size": 12, "title": "\u003cb\u003eElevar reporte trimestral al Directorio\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Elevar al Directorio o autoridad equivalente, como m\u00ednimo trimestralmente, un reporte de an\u00e1lisis con las acciones realizadas en el marco de sus responsabilidades haciendo especial \u00e9nfasis en el resultado de la evaluaci\u00f3n realizada sobre el informe que trimestralmente le eleva el Responsable de atenci\u00f3n al usuario de servicios financieros. El referido reporte deber\u00e1 ser evaluado por ese \u00f3rgano directivo, dejando constancia en el Libro de Actas respectivo.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003eplazo: trimestral\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_para_el_caso_de_los_sujetos_obligados_no_alcanzados_por_la_obligacion_prevista_e", "label": "Evaluar reportes de otros sujetos obligados", "shape": "dot", "size": 12, "title": "\u003cb\u003eEvaluar reportes de otros sujetos obligados\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Para el caso de los sujetos obligados no alcanzados por la obligaci\u00f3n prevista en el punto 3.2.1.1., el Directorio o autoridad equivalente deber\u00e1 evaluar los reportes que le eleve el responsable de atenci\u00f3n al usuario de servicios financieros.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_como_minimo_una_vez_al_ano_el_servicio_de_atencion_al_usuario_de_servicios_finan", "label": "Realizar evaluaci\u00f3n anual de servicio de atenci\u00f3n", "shape": "dot", "size": 12, "title": "\u003cb\u003eRealizar evaluaci\u00f3n anual de servicio de atenci\u00f3n\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Como m\u00ednimo una vez al a\u00f1o, el Servicio de Atenci\u00f3n al Usuario de Servicios Financieros y los procesos implementados para el cumplimiento de las obligaciones establecidas en estas normas deber\u00e1n ser objeto de evaluaci\u00f3n integral y reporte escrito por parte de la auditor\u00eda interna.\u003cbr/\u003etipo: presentacion_informativa\u003cbr/\u003eplazo: anual\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_la_auditoria_interna_debe_verificar_que_se_proporciona_a_los_usuarios_de_servici", "label": "Verificar entrega de formularios y contratos", "shape": "dot", "size": 12, "title": "\u003cb\u003eVerificar entrega de formularios y contratos\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: La auditor\u00eda interna debe verificar que se proporciona a los usuarios de servicios financieros copia de los formularios que firman y ejemplares de los contratos formalizados con el sujeto obligado, en tiempo y forma previstos.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_se_debe_notificar_en_el_cuerpo_del_contrato_cuales_son_los_conceptos_sobre_los_c", "label": "Notificar comisiones y cargos en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificar comisiones y cargos en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Se debe notificar en el cuerpo del contrato cu\u00e1les son los conceptos sobre los cuales se les aplicar\u00e1n comisiones y cargos por los productos o servicios que contraten y de los respectivos importes o porcentajes, as\u00ed como de sus derechos y obligaciones emergentes de la contrataci\u00f3n, incluida la facultad de revocaci\u00f3n.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_se_debe_notificar_en_el_contrato_a_los_usuarios_de_servicios_financieros_sobre_l", "label": "Notificar condiciones modificables en contrato", "shape": "dot", "size": 12, "title": "\u003cb\u003eNotificar condiciones modificables en contrato\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Se debe notificar en el contrato a los usuarios de servicios financieros sobre las condiciones que pueden ser objeto de modificaci\u00f3n, as\u00ed como de la facultad de rescisi\u00f3n tanto del usuario como del sujeto obligado.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_los_registros_centralizados_de_consultas_y_reclamos_rccr_de_reintegros_de_import", "label": "Administrar registros centralizados adecuadamente", "shape": "dot", "size": 12, "title": "\u003cb\u003eAdministrar registros centralizados adecuadamente\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: Los Registros Centralizados de Consultas y Reclamos (RCCR), de Reintegros de Importes (RRI) y de Denuncias ante las Instancias Judiciales y/o Administrativas de Defensa del Consumidor (RDJA) sean adecuadamente administrados y actualizados de acuerdo con los requisitos previstos en estas normas.\u003cbr/\u003etipo: otra\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_sujeto_obligado_se_le_debera_informar_el_estado_del_tramite_cada_vez_que_lo_r", "label": "Informar estado de tr\u00e1mite a solicitud de usuario", "shape": "dot", "size": 12, "title": "\u003cb\u003eInformar estado de tr\u00e1mite a solicitud de usuario\u003c/b\u003e\u003cbr/\u003e\u003ci\u003eObligacion\u003c/i\u003e\u003cbr/\u003edescripcion: El sujeto obligado se le deber\u00e1 informar el estado del tr\u00e1mite cada vez que lo requiera.\u003cbr/\u003etipo: comunicacion_a_cliente\u003cbr/\u003e\u2014\u003cbr/\u003esource_doc: TO_proteccion_usuarios_servicios_financieros_actual.pdf\u003cbr/\u003elocation: Punto 3.2. Controles. (parte 1)"}, {"color": "#27ae60", "font": {"color": "#222"}, "id": "Obligacion_el_sujeto_obligado
