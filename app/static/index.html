<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinRegGraph — chat sobre regulación BCRA</title>
<style>
  :root {
    --borde: #d8d8d8;
    --fondo: #f6f6f4;
    --tinta: #222;
    --tinta-suave: #777;
    --usuario: #e8eef7;
    --agente: #ffffff;
    --error: #b03030;
    --aviso-fondo: #fdf6e3;
    --aviso-borde: #e0d3a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--borde);
    background: #fff;
  }
  header h1 { margin: 0 0 0.5rem; font-size: 1.05rem; font-weight: 600; }
  .controles { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .controles select { max-width: 26rem; padding: 0.25rem; }
  .controles input { padding: 0.3rem; border: 1px solid var(--borde); border-radius: 5px; font-size: 0.8rem; width: 11rem; }
  .controles .identidad { font-size: 0.8rem; color: var(--tinta-suave); }
  .controles a.salir { font-size: 0.75rem; color: var(--tinta-suave); margin-left: 0.2rem; }
  .controles .auth-error { color: var(--error); font-size: 0.75rem; }
  .sesion { margin-top: 0.35rem; font-size: 0.72rem; color: var(--tinta-suave); font-family: ui-monospace, Menlo, monospace; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    max-width: 52rem;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin: 0.6rem 0; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--borde); white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.usuario { background: var(--usuario); margin-left: 15%; }
  .msg.agente { background: var(--agente); margin-right: 15%; white-space: normal; }
  .msg.agente .texto { white-space: pre-wrap; }
  .msg.error { background: #fbeaea; border-color: #e0b4b4; color: var(--error); }
  .msg.nota { background: transparent; border: none; color: var(--tinta-suave); font-size: 0.8rem; text-align: center; }
  .meta { font-size: 0.72rem; color: var(--tinta-suave); margin-bottom: 0.3rem; }
  .aviso {
    margin: 0.45rem 0; padding: 0.3rem 0.55rem; font-size: 0.8rem;
    background: var(--aviso-fondo); border: 1px solid var(--aviso-borde); border-radius: 5px;
  }
  details { margin-top: 0.45rem; font-size: 0.82rem; }
  details summary { cursor: pointer; color: var(--tinta-suave); user-select: none; }
  details ul { margin: 0.3rem 0 0.2rem; padding-left: 1.2rem; }
  .tool { margin: 0.35rem 0; padding: 0.35rem 0.5rem; background: #f4f4f2; border-radius: 5px; }
  .tool .nombre { font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; }
  .tool .args, .tool .resumen { font-size: 0.76rem; margin-top: 0.15rem; overflow-wrap: anywhere; }
  .tool .args { font-family: ui-monospace, Menlo, monospace; color: var(--tinta-suave); }
  .feedback { margin-top: 0.55rem; padding-top: 0.5rem; border-top: 1px dashed var(--borde); display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .feedback button.voto { font-size: 0.95rem; padding: 0.15rem 0.5rem; background: #fff; border: 1px solid var(--borde); border-radius: 5px; cursor: pointer; }
  .feedback button.voto.sel { border-color: #5a7bad; background: var(--usuario); }
  .feedback input { flex: 1; min-width: 10rem; padding: 0.3rem; border: 1px solid var(--borde); border-radius: 5px; font-size: 0.8rem; }
  .feedback .enviado { font-size: 0.78rem; color: #3a7a3a; }
  .feedback :disabled { opacity: 0.55; cursor: default; }
  form#entrada {
    display: flex; gap: 0.5rem; padding: 0.8rem 1rem;
    border-top: 1px solid var(--borde); background: #fff;
    max-width: 52rem; width: 100%; margin: 0 auto;
  }
  form#entrada input { flex: 1; padding: 0.5rem; border: 1px solid var(--borde); border-radius: 6px; font-size: 0.9rem; }
  form#entrada button, .controles button {
    padding: 0.45rem 0.9rem; border: 1px solid var(--borde); border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 0.85rem;
  }
  form#entrada button:disabled, form#entrada input:disabled { opacity: 0.55; cursor: default; }
  .pensando { color: var(--tinta-suave); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>FinRegGraph — chat sobre regulación BCRA</h1>
  <div class="controles">
    <label for="run-select">Grafo:</label>
    <select id="run-select"></select>
    <span id="auth-zona"></span>
    <button id="btn-nueva-sesion" type="button">Nueva sesión</button>
  </div>
  <div class="sesion" id="sesion-info">sesión: — (se crea con el primer mensaje)</div>
</header>

<main id="chat"></main>

<form id="entrada">
  <input id="pregunta" type="text" placeholder="Escribí tu pregunta sobre la regulación…" autocomplete="off">
  <button id="btn-enviar" type="submit">Enviar</button>
</form>

<script>
"use strict";
// Estado del CHAT en memoria JS (recargar la página = sesión de chat nueva).
// La identidad del registro sí persiste en localStorage — ver la nota de la
// zona de identidad más abajo.
let sessionId = null;
let enviando = false;

const chat = document.getElementById("chat");
const sel = document.getElementById("run-select");
const sesionInfo = document.getElementById("sesion-info");
const form = document.getElementById("entrada");
const inputPregunta = document.getElementById("pregunta");
const btnEnviar = document.getElementById("btn-enviar");
// --- Identidad por registro autoservicio (H6) ---
// Reversión CONSCIENTE de la decisión de U4 "sin localStorage": el token del
// registro se persiste en localStorage a propósito, para que quien se registra
// nunca vea ni administre un token y siga identificado tras recargar la página
// ("salir" lo borra). El resto del estado (sesión de chat, historial) sigue
// siendo efímero en memoria.
let authToken = localStorage.getItem("fg_token") || "";
let authUsuario = localStorage.getItem("fg_usuario") || "";

function headersAuth() {
  const h = { "Content-Type": "application/json" };
  if (authToken) h["Authorization"] = "Bearer " + authToken;
  return h;
}

function setSession(id) {
  sessionId = id;
  sesionInfo.textContent = "sesión: " + (id || "— (se crea con el primer mensaje)");
}

function el(tag, className, texto) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function agregar(nodo) {
  chat.appendChild(nodo);
  chat.scrollTop = chat.scrollHeight;
  return nodo;
}

function addNota(texto) { return agregar(el("div", "msg nota", texto)); }
function addError(texto) { return agregar(el("div", "msg error", texto)); }
function addUsuario(texto) { return agregar(el("div", "msg usuario", texto)); }

function detailATexto(data) {
  if (data && typeof data.detail === "string") return data.detail;
  if (data && data.detail !== undefined) return JSON.stringify(data.detail);
  return "error desconocido";
}

function setEnviando(v) {
  enviando = v;
  inputPregunta.disabled = v;
  btnEnviar.disabled = v;
}

// ---------- runs ----------
async function cargarRuns() {
  try {
    const resp = await fetch("/runs");
    const runs = await resp.json();
    sel.innerHTML = "";
    for (const r of runs) {
      const o = document.createElement("option");
      o.value = r.id;
      if (r.error) {
        o.disabled = true;
        o.textContent = r.id + " — error: " + r.error;
      } else {
        o.textContent = r.id + " — " + r.nodos + " nodos / " + r.aristas + " aristas"
                      + (r.id === "run_3_ppf_core" ? " (recomendado)" : "")
                      + (r.id === "grafo_v2" ? " (v2 experimental)" : "")
                      + (r.id === "v3_vigente" ? " (vigente)" : "");
      }
      sel.appendChild(o);
    }
    const opciones = Array.from(sel.options);
    const recomendada = opciones.find(o => o.value === "run_3_ppf_core" && !o.disabled);
    const primera = recomendada || opciones.find(o => !o.disabled);
    if (primera) sel.value = primera.value;
  } catch (e) {
    addError("No se pudo cargar la lista de grafos: " + e.message);
  }
}

sel.addEventListener("change", () => {
  setSession(null);
  addNota("Cambio de grafo a " + sel.value + " — sesión nueva.");
});

document.getElementById("btn-nueva-sesion").addEventListener("click", () => {
  setSession(null);
  addNota("Sesión nueva.");
});

// ---------- respuesta del agente ----------
function addAgente(data) {
  const box = el("div", "msg agente");
  box.appendChild(el("div", "meta", "turno " + data.turno + " · " + sel.value));

  const r = data.respuesta || {};
  if (r.respuesta_cruda !== undefined) {
    box.appendChild(el("div", "aviso", "Respuesta sin parsear (el agente no devolvió el JSON esperado); se muestra el texto crudo."));
    box.appendChild(el("div", "texto", r.respuesta_cruda || "(vacía)"));
  } else {
    box.appendChild(el("div", "texto", r.respuesta || "(sin texto)"));
    if (r.respondible === false) {
      box.appendChild(el("div", "aviso", "El agente declaró no poder responder con el grafo."));
    }
  }

  const citas = Array.isArray(r.citas) ? r.citas : [];
  if (citas.length) {
    const det = el("details");
    det.appendChild(el("summary", null, "citas (" + citas.length + ")"));
    const ul = el("ul");
    for (const c of citas) {
      ul.appendChild(el("li", null, (c.source_doc || "?") + " — " + (c.location || "?")));
    }
    det.appendChild(ul);
    box.appendChild(det);
  }

  const tools = Array.isArray(data.tools_llamadas) ? data.tools_llamadas : [];
  const detTools = el("details");
  detTools.appendChild(el("summary", null, "tools (" + tools.length + ")"));
  for (const t of tools) {
    const dv = el("div", "tool");
    dv.appendChild(el("div", "nombre", t.tool));
    dv.appendChild(el("div", "args", JSON.stringify(t.argumentos)));
    dv.appendChild(el("div", "resumen", t.resumen));
    detTools.appendChild(dv);
  }
  box.appendChild(detTools);

  box.appendChild(controlesFeedback(data.session_id, data.turno));
  return agregar(box);
}

// ---------- feedback ----------
function controlesFeedback(sid, turno) {
  const wrap = el("div", "feedback");
  let voto = null;

  const up = el("button", "voto", "👍");
  const down = el("button", "voto", "👎");
  up.type = down.type = "button";
  const comentario = document.createElement("input");
  comentario.type = "text";
  comentario.placeholder = "comentario (opcional)";
  const enviar = el("button", "voto", "Enviar feedback");
  enviar.type = "button";
  enviar.disabled = true;

  function elegir(v) {
    voto = v;
    up.classList.toggle("sel", v === "up");
    down.classList.toggle("sel", v === "down");
    enviar.disabled = false;
  }
  up.addEventListener("click", () => elegir("up"));
  down.addEventListener("click", () => elegir("down"));

  enviar.addEventListener("click", async () => {
    enviar.disabled = true;
    try {
      const resp = await fetch("/feedback", {
        method: "POST",
        headers: headersAuth(),
        body: JSON.stringify({
          session_id: sid,
          turno: turno,
          voto: voto,
          comentario: comentario.value.trim() || null,
        }),
      });
      const d = await resp.json();
      if (!resp.ok) {
        if (resp.status === 401) {
          addError("Tu identificación expiró o fue revocada: tocá 'salir' y volvé a registrarte.");
        } else {
          addError("Feedback rechazado: " + detailATexto(d));
        }
        enviar.disabled = false;
        return;
      }
      [up, down, comentario, enviar].forEach(x => { x.disabled = true; });
      wrap.appendChild(el("span", "enviado", "✓ feedback enviado"));
    } catch (e) {
      addError("Error de red al enviar feedback: " + e.message);
      enviar.disabled = false;
    }
  });

  wrap.append(up, down, comentario, enviar);
  return wrap;
}

// ---------- envío de pregunta ----------
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = inputPregunta.value.trim();
  if (!q || enviando) return;
  const runId = sel.value;
  if (!runId) { addError("No hay ningún grafo seleccionable."); return; }

  addUsuario(q);
  inputPregunta.value = "";
  setEnviando(true);
  const pensando = agregar(el("div", "msg nota pensando", "pensando…"));

  try {
    const body = { run_id: runId, pregunta: q };
    if (sessionId) body.session_id = sessionId;
    const resp = await fetch("/chat", {
      method: "POST",
      headers: headersAuth(),
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    pensando.remove();
    if (!resp.ok) {
      if (resp.status === 401) {
        addError("Tu identificación expiró o fue revocada: tocá 'salir' y volvé a registrarte.");
      } else {
        addError(detailATexto(data));
      }
      return;
    }
    setSession(data.session_id);
    addAgente(data);
  } catch (e) {
    pensando.remove();
    addError("Error de red: " + e.message);
  } finally {
    setEnviando(false);
    inputPregunta.focus();
  }
});

// ---------- zona de identidad: registro o sesión activa ----------
const authZona = document.getElementById("auth-zona");

function renderAuth() {
  authZona.innerHTML = "";
  if (authToken) {
    authZona.appendChild(el("span", "identidad",
                            "identificado como: " + (authUsuario || "?") + " "));
    const salir = el("a", "salir", "salir");
    salir.href = "#";
    salir.addEventListener("click", (ev) => {
      ev.preventDefault();
      localStorage.removeItem("fg_token");
      localStorage.removeItem("fg_usuario");
      location.reload();
    });
    authZona.appendChild(salir);
    return;
  }
  const nombre = document.createElement("input");
  nombre.placeholder = "tu nombre";
  nombre.autocomplete = "off";
  const clave = document.createElement("input");
  clave.type = "password";
  clave.placeholder = "contraseña";
  const codigo = document.createElement("input");
  codigo.type = "password";
  codigo.placeholder = "código de invitación (solo la primera vez)";
  const entrar = el("button", null, "Entrar");
  entrar.type = "button";
  const err = el("span", "auth-error", "");

  function guardar(d) {
    localStorage.setItem("fg_token", d.token);
    localStorage.setItem("fg_usuario", d.usuario);
    authToken = d.token;
    authUsuario = d.usuario;
    renderAuth();
  }

  entrar.addEventListener("click", async () => {
    err.textContent = "";
    entrar.disabled = true;
    try {
      // Primero login; si el usuario no existe y hay código, registro.
      let resp = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario: nombre.value.trim(), clave: clave.value }),
      });
      let d = await resp.json();
      if (resp.ok) { guardar(d); return; }
      if (resp.status === 404) {
        if (!codigo.value.trim()) {
          err.textContent = "primera vez: ingresá el código de invitación";
          return;
        }
        resp = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: nombre.value.trim(),
                                 clave: clave.value,
                                 codigo: codigo.value.trim() }),
        });
        d = await resp.json();
        if (resp.ok) { guardar(d); return; }
      }
      err.textContent = detailATexto(d);
    } catch (e) {
      err.textContent = "Error de red: " + e.message;
    } finally {
      entrar.disabled = false;
    }
  });
  authZona.append(nombre, clave, codigo, entrar, err);
}

renderAuth();
cargarRuns();
// Bienvenida: solo al cargar la página (no se re-agrega al cambiar de sesión).
addNota("Preguntale al agente sobre regulación del BCRA — responde usando solo "
        + "el knowledge graph seleccionado y cita la norma. Por ejemplo: "
        + "¿con cuántos días de atraso un deudor pasa a situación 2?");
inputPregunta.focus();
</script>
</body>
</html>
