<rect data-caja="leyenda_resultado" x="24.0" y="563.0" width="24.0" height="16.0" fill="#fafafa" stroke="#999999" stroke-width="2.4" rx="3"/>
<text x="21.0" y="35.9" font-size="14" font-weight="bold" fill="#1f1f1f">Pregunta</text>
<text x="21.0" y="58.1" font-size="13" font-weight="normal" fill="#444444">Para una entidad financiera, ¿qué condiciones hacen que los</text>
<text x="21.0" y="75.1" font-size="13" font-weight="normal" fill="#444444">créditos para consumo o vivienda deban clasificarse en la cartera</text>
<text x="21.0" y="92.1" font-size="13" font-weight="normal" fill="#444444">comercial?</text>
<text x="439.0" y="35.9" font-size="14" font-weight="bold" fill="#1f1f1f">Criterios</text>
<text x="439.0" y="58.1" font-size="13" font-weight="normal" fill="#444444">1. Supera dos veces el importe de referencia</text>
<text x="439.0" y="75.1" font-size="13" font-weight="normal" fill="#444444">2. El importe es el máximo de ventas anuales de la</text>
<text x="439.0" y="92.1" font-size="13" font-weight="normal" fill="#444444">categoría Micro del sector Comercio</text>
<text x="439.0" y="109.1" font-size="13" font-weight="normal" fill="#444444">3. El repago depende de la actividad del cliente</text>
<text x="21.0" y="211.4" font-size="14" font-weight="bold" fill="#1f1f1f">Agente</text>
<text x="21.0" y="233.6" font-size="13" font-weight="normal" fill="#444444">Consulta el</text>
<text x="21.0" y="250.6" font-size="13" font-weight="normal" fill="#444444">grafo</text>
<text x="127.0" y="168.9" font-size="14" font-weight="bold" fill="#1f1f1f">Respuesta</text>
<text x="127.0" y="191.1" font-size="13" font-weight="normal" fill="#444444">Esos créditos pasan a la cartera</text>
<text x="127.0" y="208.1" font-size="13" font-weight="normal" fill="#444444">comercial cuando superan dos</text>
<text x="127.0" y="225.1" font-size="13" font-weight="normal" fill="#444444">veces el importe de referencia y su</text>
<text x="127.0" y="242.1" font-size="13" font-weight="normal" fill="#444444">repago depende de la actividad del</text>
<text x="127.0" y="259.1" font-size="13" font-weight="normal" fill="#444444">cliente</text>
<text x="127.0" y="276.1" font-size="13" font-weight="normal" fill="#444444">Cita: Clasificación de deudores,</text>
<text x="127.0" y="293.1" font-size="13" font-weight="normal" fill="#444444">5.1.1.1</text>
<text x="381.0" y="193.9" font-size="14" font-weight="bold" fill="#1f1f1f">Juez de las</text>
<text x="381.0" y="211.9" font-size="14" font-weight="bold" fill="#1f1f1f">respuestas</text>
<text x="381.0" y="234.1" font-size="13" font-weight="normal" fill="#444444">1. Cumple</text>
<text x="381.0" y="251.1" font-size="13" font-weight="normal" fill="#444444">2. No cumple</text>
<text x="381.0" y="268.1" font-size="13" font-weight="normal" fill="#444444">3. Cumple</text>
<text x="499.0" y="185.4" font-size="14" font-weight="bold" fill="#1f1f1f">Regla del</text>
<text x="499.0" y="203.4" font-size="14" font-weight="bold" fill="#1f1f1f">veredicto</text>
<text x="499.0" y="225.6" font-size="13" font-weight="normal" fill="#444444">Todos cumplidos,</text>
<text x="499.0" y="242.6" font-size="13" font-weight="normal" fill="#444444">correcta</text>
<text x="499.0" y="259.6" font-size="13" font-weight="normal" fill="#444444">Ninguno, incorrecta</text>
<text x="499.0" y="276.6" font-size="13" font-weight="normal" fill="#444444">Los demás, parcial</text>
<text x="652.0" y="211.4" font-size="14" font-weight="bold" fill="#1f1f1f">Parcial</text>
<text x="652.0" y="233.6" font-size="13" font-weight="normal" fill="#444444">Cumple 2 de 3</text>
<text x="652.0" y="250.6" font-size="13" font-weight="normal" fill="#444444">criterios</text>
<text x="21.0" y="310.4" font-size="14" font-weight="bold" fill="#1f1f1f">Traza</text>
<text x="21.0" y="332.6" font-size="13" font-weight="normal" fill="#444444">Abrió el</text>
<text x="21.0" y="349.6" font-size="13" font-weight="normal" fill="#444444">5.1.1.1 y</text>
<text x="21.0" y="366.6" font-size="13" font-weight="normal" fill="#444444">no siguió la</text>
<text x="21.0" y="383.6" font-size="13" font-weight="normal" fill="#444444">remisión al</text>
<text x="21.0" y="400.6" font-size="13" font-weight="normal" fill="#444444">3.7</text>
<text x="127.0" y="352.9" font-size="14" font-weight="bold" fill="#1f1f1f">Indicadores de las citas</text>
<text x="127.0" y="375.1" font-size="13" font-weight="normal" fill="#444444">Las citas existen</text>
<text x="127.0" y="392.1" font-size="13" font-weight="normal" fill="#444444">Las citas fueron consultadas</text>
<text x="127.0" y="409.1" font-size="13" font-weight="normal" fill="#444444">Una cita es el punto que</text>
<text x="127.0" y="426.1" font-size="13" font-weight="normal" fill="#444444">responde</text>
<text x="342.0" y="369.9" font-size="14" font-weight="bold" fill="#1f1f1f">Fundada</text>
<text x="342.0" y="392.1" font-size="13" font-weight="normal" fill="#444444">Cumple los 3</text>
<text x="342.0" y="409.1" font-size="13" font-weight="normal" fill="#444444">indicadores</text>
<text x="449.0" y="359.9" font-size="14" font-weight="bold" fill="#1f1f1f">Lectura de la autora</text>
<text x="449.0" y="382.1" font-size="13" font-weight="normal" fill="#444444">Pone el veredicto</text>
<text x="449.0" y="399.1" font-size="13" font-weight="normal" fill="#444444">contra el texto oficial</text>
<text x="637.0" y="409.4" font-size="14" font-weight="bold" fill="#1f1f1f">Atribución de</text>
<text x="637.0" y="427.4" font-size="14" font-weight="bold" fill="#1f1f1f">la falla</text>
<text x="637.0" y="449.6" font-size="13" font-weight="normal" fill="#444444">Abrió uno de los</text>
<text x="637.0" y="466.6" font-size="13" font-weight="normal" fill="#444444">puntos que</text>
<text x="637.0" y="483.6" font-size="13" font-weight="normal" fill="#444444">responden</text>
<text x="670.0" y="543.4" font-size="14" font-weight="bold" fill="#1f1f1f">Clase 4</text>
<text x="670.0" y="565.6" font-size="13" font-weight="normal" fill="#444444">Lo consultó</text>
<text x="459.8" y="312.6" font-size="13" font-weight="normal" fill="#444444">Si un criterio queda en duda</text>
<text x="707.0" y="328.6" font-size="13" font-weight="normal" fill="#444444">Si falla</text>
<text x="57.0" y="486.6" font-size="13" font-weight="normal" fill="#1f1f1f">Pieza que ejecuta un modelo de lenguaje</text>
<text x="57.0" y="508.6" font-size="13" font-weight="normal" fill="#1f1f1f">Reglas fijas</text>
<text x="57.0" y="530.6" font-size="13" font-weight="normal" fill="#1f1f1f">Datos</text>
<text x="57.0" y="552.6" font-size="13" font-weight="normal" fill="#1f1f1f">Lectura de la autora</text>
<text x="57.0" y="574.6" font-size="13" font-weight="normal" fill="#1f1f1f">Resultado</text>
</svg>
