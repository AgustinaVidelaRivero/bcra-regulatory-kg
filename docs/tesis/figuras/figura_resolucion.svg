<rect x="538.0" y="585.0" width="16.0" height="8.0" fill="white" stroke="#e2e2e2" stroke-width="1" rx="2"/>
<text x="26.0" y="36.2" font-size="15" fill="#1f1f1f">Entidad que devolvió el extractor: tipo, etiqueta, descripción y punto</text>
<text x="33.0" y="66.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Condicion</text>
<text x="124.3" y="66.7" font-size="15" font-style="italic" fill="#444444">«Superar dos veces importe referencia punto 3.7»,</text>
<text x="29.0" y="87.7" font-size="15" font-style="italic" fill="#444444">punto 5.1.1.1</text>
<text x="26.0" y="157.2" font-size="15" fill="#1f1f1f">Validador y ensamblado: el tipo tiene que estar entre los 9 que se</text>
<text x="26.0" y="175.2" font-size="15" fill="#1f1f1f">extraen del texto; si no, la entidad queda fuera</text>
<text x="33.0" y="205.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Condicion</text>
<text x="124.3" y="205.7" font-size="15" font-style="italic" fill="#444444">está en la lista</text>
<text x="26.0" y="275.2" font-size="15" fill="#1f1f1f">Ensamblado: un identificador con el tipo y lo que identifica a la</text>
<text x="26.0" y="293.2" font-size="15" fill="#1f1f1f">entidad; en una de contenido, también el documento y el punto</text>
<text x="33.0" y="323.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Condicion</text>
<text x="124.3" y="323.7" font-size="15" font-style="italic" fill="#444444">se arma con tipo, etiqueta, descripción, documento</text>
<text x="29.0" y="344.7" font-size="15" font-style="italic" fill="#444444">y punto</text>
<text x="26.0" y="414.2" font-size="15" fill="#1f1f1f">¿Ya hay un nodo con ese identificador?</text>
<text x="26.0" y="432.2" font-size="15" fill="#1f1f1f">Sí: se une a él y suma su procedencia.</text>
<text x="26.0" y="450.2" font-size="15" fill="#1f1f1f">No: es un nodo nuevo</text>
<text x="33.0" y="480.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Condicion</text>
<text x="124.3" y="480.7" font-size="15" font-style="italic" fill="#444444">es un nodo nuevo</text>
<text x="33.0" y="501.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">TextoOrdenado</text>
<text x="160.4" y="501.7" font-size="15" font-style="italic" fill="#444444">del 5.1.1.1: se une al nodo de 140 unidades</text>
<text x="29.0" y="522.7" font-size="15" font-style="italic" fill="#444444">de Clasificación de deudores</text>
<text x="26.0" y="592.2" font-size="15" fill="#1f1f1f">Al juntar los documentos, se unen los sujetos del catálogo y las</text>
<text x="26.0" y="610.2" font-size="15" fill="#1f1f1f">comunicaciones con el mismo código</text>
<text x="534.0" y="36.2" font-size="15" fill="#1f1f1f">Sujeto de una relación: la mención y la</text>
<text x="534.0" y="54.2" font-size="15" fill="#1f1f1f">entrada del catálogo que sugiere el</text>
<text x="534.0" y="72.2" font-size="15" fill="#1f1f1f">extractor</text>
<text x="537.0" y="102.7" font-size="15" font-style="italic" fill="#444444">Del 5.1.1.2: mención «la entidad»; entrada</text>
<text x="537.0" y="123.7" font-size="15" font-style="italic" fill="#444444">sugerida:</text>
<text x="541.0" y="144.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Sujeto</text>
<text x="605.2" y="144.7" font-size="15" font-style="italic" fill="#444444">Obligados a clasificar deudores</text>
<text x="537.0" y="165.7" font-size="15" font-style="italic" fill="#444444">(Clasificación)</text>
<text x="534.0" y="235.2" font-size="15" fill="#1f1f1f">Ensamblado:</text>
<text x="534.0" y="253.2" font-size="15" fill="#1f1f1f">1. la entrada cuyo nombre o alias es la</text>
<text x="550.7" y="271.2" font-size="15" fill="#1f1f1f">mención;</text>
<text x="534.0" y="289.2" font-size="15" fill="#1f1f1f">2. si no hay, la que sugirió el extractor;</text>
<text x="534.0" y="307.2" font-size="15" fill="#1f1f1f">3. si no sugirió ninguna, la de una regla</text>
<text x="550.7" y="325.2" font-size="15" fill="#1f1f1f">sobre la mención;</text>
<text x="534.0" y="343.2" font-size="15" fill="#1f1f1f">4. si nada corresponde, un sujeto</text>
<text x="550.7" y="361.2" font-size="15" fill="#1f1f1f">propuesto, en cuarentena</text>
<text x="537.0" y="391.7" font-size="15" font-style="italic" fill="#444444">Las relaciones del 5.1.1.2, por el 2:</text>
<text x="541.0" y="412.7" font-size="15" font-family="Menlo,Consolas,'Courier New',monospace" font-weight="bold" fill="#1f1f1f">Sujeto</text>
<text x="605.2" y="412.7" font-size="15" font-style="italic" fill="#444444">Obligados a clasificar deudores</text>
<text x="537.0" y="433.7" font-size="15" font-style="italic" fill="#444444">(Clasificación)</text>
<text x="567.0" y="549.2" font-size="15" fill="#1f1f1f">Reglas fijas</text>
<text x="567.0" y="571.2" font-size="15" fill="#1f1f1f">Datos</text>
<text x="567.0" y="593.2" font-size="15" fill="#1f1f1f">Ejemplo, en cursiva y sobre blanco,</text>
<text x="567.0" y="611.2" font-size="15" fill="#1f1f1f">leído del grafo y de la extracción</text>
</svg>
