<text x="337.0" y="65.9" font-size="14" font-weight="bold" fill="#1f1f1f">Servidor de los</text>
<text x="337.0" y="83.9" font-size="14" font-weight="bold" fill="#1f1f1f">fragmentos</text>
<text x="337.0" y="106.1" font-size="13" font-weight="normal" fill="#444444">Una herramienta,</text>
<text x="337.0" y="123.1" font-size="13" font-weight="normal" fill="#444444">que devuelve los 5</text>
<text x="337.0" y="140.1" font-size="13" font-weight="normal" fill="#444444">fragmentos más</text>
<text x="337.0" y="157.1" font-size="13" font-weight="normal" fill="#444444">afines, en 2</text>
<text x="337.0" y="174.1" font-size="13" font-weight="normal" fill="#444444">configuraciones, la</text>
<text x="337.0" y="191.1" font-size="13" font-weight="normal" fill="#444444">combinada y la</text>
<text x="337.0" y="208.1" font-size="13" font-weight="normal" fill="#444444">densa</text>
<text x="503.0" y="65.9" font-size="14" font-weight="bold" fill="#1f1f1f">Los fragmentos</text>
<text x="503.0" y="88.1" font-size="13" font-weight="normal" fill="#444444">Todas las unidades</text>
<text x="503.0" y="105.1" font-size="13" font-weight="normal" fill="#444444">de extracción,</text>
<text x="503.0" y="122.1" font-size="13" font-weight="normal" fill="#444444">también las</text>
<text x="503.0" y="139.1" font-size="13" font-weight="normal" fill="#444444">apartadas</text>
<text x="650.0" y="65.9" font-size="14" font-weight="bold" fill="#1f1f1f">La respuesta</text>
<text x="650.0" y="88.1" font-size="13" font-weight="normal" fill="#444444">El texto, las</text>
<text x="650.0" y="105.1" font-size="13" font-weight="normal" fill="#444444">citas con su</text>
<text x="650.0" y="122.1" font-size="13" font-weight="normal" fill="#444444">documento y</text>
<text x="650.0" y="139.1" font-size="13" font-weight="normal" fill="#444444">su punto, y si</text>
<text x="650.0" y="156.1" font-size="13" font-weight="normal" fill="#444444">encontró con</text>
<text x="650.0" y="173.1" font-size="13" font-weight="normal" fill="#444444">qué responder</text>
<text x="503.0" y="214.9" font-size="14" font-weight="bold" fill="#1f1f1f">La traza</text>
<text x="503.0" y="237.1" font-size="13" font-weight="normal" fill="#444444">Cada llamada, con</text>
<text x="503.0" y="254.1" font-size="13" font-weight="normal" fill="#444444">su entrada y su</text>
<text x="503.0" y="271.1" font-size="13" font-weight="normal" fill="#444444">salida, que guarda</text>
<text x="503.0" y="288.1" font-size="13" font-weight="normal" fill="#444444">el servidor</text>
<text x="337.0" y="294.9" font-size="14" font-weight="bold" fill="#1f1f1f">Servidor del</text>
<text x="337.0" y="312.9" font-size="14" font-weight="bold" fill="#1f1f1f">grafo</text>
<text x="337.0" y="335.1" font-size="13" font-weight="normal" fill="#444444">3 herramientas</text>
<text x="337.0" y="352.1" font-size="13" font-weight="normal" fill="#444444">sobre los nodos y 7</text>
<text x="337.0" y="369.1" font-size="13" font-weight="normal" fill="#444444">de navegación por</text>
<text x="337.0" y="386.1" font-size="13" font-weight="normal" fill="#444444">los puntos</text>
<text x="503.0" y="363.9" font-size="14" font-weight="bold" fill="#1f1f1f">El grafo evaluado</text>
<text x="503.0" y="386.1" font-size="13" font-weight="normal" fill="#444444">El sellado, en Neo4j</text>
<text x="145.0" y="172.4" font-size="14" font-weight="bold" fill="#1f1f1f">Agente</text>
<text x="145.0" y="194.6" font-size="13" font-weight="normal" fill="#444444">Claude Sonnet 5</text>
<text x="145.0" y="211.6" font-size="13" font-weight="normal" fill="#444444">en Claude</text>
<text x="145.0" y="228.6" font-size="13" font-weight="normal" fill="#444444">Code, con sus</text>
<text x="145.0" y="245.6" font-size="13" font-weight="normal" fill="#444444">herramientas</text>
<text x="145.0" y="262.6" font-size="13" font-weight="normal" fill="#444444">propias</text>
<text x="145.0" y="279.6" font-size="13" font-weight="normal" fill="#444444">apagadas</text>
<text x="21.0" y="138.4" font-size="14" font-weight="bold" fill="#1f1f1f">El pedido</text>
<text x="21.0" y="160.6" font-size="13" font-weight="normal" fill="#444444">La plantilla,</text>
<text x="21.0" y="177.6" font-size="13" font-weight="normal" fill="#444444">igual para los</text>
<text x="21.0" y="194.6" font-size="13" font-weight="normal" fill="#444444">2 sistemas,</text>
<text x="21.0" y="211.6" font-size="13" font-weight="normal" fill="#444444">con la</text>
<text x="21.0" y="228.6" font-size="13" font-weight="normal" fill="#444444">pregunta, el</text>
<text x="21.0" y="245.6" font-size="13" font-weight="normal" fill="#444444">tope de 30</text>
<text x="21.0" y="262.6" font-size="13" font-weight="normal" fill="#444444">llamadas y el</text>
<text x="21.0" y="279.6" font-size="13" font-weight="normal" fill="#444444">bloque de las</text>
<text x="21.0" y="296.6" font-size="13" font-weight="normal" fill="#444444">herramientas</text>
<text x="21.0" y="313.6" font-size="13" font-weight="normal" fill="#444444">del servidor</text>
<text x="264.5" y="122.2" font-size="13" font-weight="normal" fill="#444444">llamadas</text>
<text x="257.3" y="229.9" font-size="13" font-weight="normal" fill="#444444">Un servidor</text>
<text x="259.4" y="246.9" font-size="13" font-weight="normal" fill="#444444">por corrida</text>
<text x="328.0" y="422.1" font-size="13" font-weight="normal" fill="#444444">En el ejemplo del</text>
<text x="328.0" y="439.1" font-size="13" font-weight="normal" fill="#444444">préstamo,</text>
<text x="328.0" y="456.1" font-size="13" font-weight="normal" fill="#444444">ver_remisiones lleva</text>
<text x="328.0" y="473.1" font-size="13" font-weight="normal" fill="#444444">del 5.1.1.1 al 3.7</text>
<text x="57.0" y="436.6" font-size="13" font-weight="normal" fill="#1f1f1f">Pieza que ejecuta un modelo de lenguaje</text>
<text x="57.0" y="458.6" font-size="13" font-weight="normal" fill="#1f1f1f">Reglas fijas</text>
<text x="57.0" y="480.6" font-size="13" font-weight="normal" fill="#1f1f1f">Datos</text>
</svg>
