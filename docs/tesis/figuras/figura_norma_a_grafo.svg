<text x="214.0" y="784.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">Repago vinculado a actividad</text>
<text x="214.0" y="802.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">productiva/comercial</text>
