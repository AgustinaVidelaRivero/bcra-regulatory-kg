<text x="56.0" y="118.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>Pagos de utilidades y dividendos a accionistas no residentes </tspan><tspan font-weight="bold" fill="#8a4513">en la medida que se verifiquen los</tspan></text>
<rect x="55.0" y="127.0" width="376.4" height="22.0" fill="#e07b39" opacity="0.26" rx="2"/>
<text x="56.0" y="142.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold" fill="#8a4513">requisitos previstos en los puntos 3.4.1. a 3.4.3.</tspan></text>
<rect x="42.0" y="172.0" width="776.0" height="69.0" fill="white" stroke="#d8d8d8" stroke-width="1.0" rx="4"/>
<text x="56.0" y="199.0" font-size="15" font-weight="bold" fill="#333">Punto 3.4.1</text>
<text x="56.0" y="226.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>Las utilidades y dividendos correspondan a balances cerrados y auditados.</tspan></text>
<rect x="42.0" y="256.0" width="776.0" height="117.0" fill="white" stroke="#d8d8d8" stroke-width="1.0" rx="4"/>
<text x="56.0" y="283.0" font-size="15" font-weight="bold" fill="#333">Punto 3.4.2</text>
<text x="56.0" y="310.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>[…] La entidad deberá contar con una declaración jurada firmada por el representante legal de la</tspan></text>
<text x="56.0" y="334.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>empresa residente o un apoderado con facultades suficientes para asumir este compromiso en</tspan></text>
<text x="56.0" y="358.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>nombre de la empresa.</tspan></text>
<rect x="42.0" y="388.0" width="776.0" height="117.0" fill="white" stroke="#d8d8d8" stroke-width="1.0" rx="4"/>
<text x="56.0" y="415.0" font-size="15" font-weight="bold" fill="#333">Punto 3.4.3</text>
<text x="56.0" y="442.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>La entidad deberá verificar que el cliente haya dado cumplimiento en caso de corresponder, a la</tspan></text>
<text x="56.0" y="466.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>declaración de la última presentación vencida del “Relevamiento de activos y pasivos externos” por</tspan></text>
<text x="56.0" y="490.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>las operaciones involucradas.</tspan></text>
