<text x="214.0" y="498.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Condicion · punto 5.1.1.1</text>
<text x="214.0" y="516.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">Superar dos veces importe referencia</text>
<text x="214.0" y="534.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">punto 3.7</text>
