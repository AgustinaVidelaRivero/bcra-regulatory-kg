<defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a8a8a"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e07b39"/></marker></defs>
<text x="24.0" y="34.0" font-size="17" font-weight="bold">En el texto</text>
<rect x="24.0" y="46.0" width="812.0" height="355.0" fill="#fafafa" stroke="#ccc" rx="5"/>
<text x="42.0" y="81.0" font-size="17" fill="#6f6f6f" xml:space="preserve"><tspan font-weight="bold">5.1.1.</tspan><tspan> Cartera comercial. Abarca todas las financiaciones comprendidas, con excepción de las</tspan></text>
<text x="42.0" y="105.0" font-size="17" fill="#6f6f6f" xml:space="preserve"><tspan>siguientes:</tspan></text>
<rect x="74.0" y="119.0" width="744.0" height="121.0" fill="white" stroke="#e07b39" stroke-width="1.8" rx="4"/>
<text x="88.0" y="150.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold">5.1.1.1.</tspan><tspan> Los créditos para consumo o vivienda. Los créditos de esta clase que superen el</tspan></text>
<rect x="192.8" y="159.0" width="507.5" height="22.0" fill="#e07b39" opacity="0.26" rx="2"/>
<text x="88.0" y="174.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>equivalente a </tspan><tspan font-weight="bold" fill="#8a4513">dos veces el importe de referencia establecido en el punto 3.7.</tspan><tspan> y cuyo</tspan></text>
<text x="88.0" y="198.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>repago no se encuentre vinculado a ingresos fijos o periódicos del cliente sino a la evolución</tspan></text>
<text x="88.0" y="222.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>de su actividad productiva o comercial se incluirán dentro de la cartera comercial.</tspan></text>
<text x="42.0" y="272.0" font-size="17" fill="#6f6f6f" xml:space="preserve"><tspan>[…]</tspan></text>
<rect x="42.0" y="286.0" width="776.0" height="97.0" fill="white" stroke="#d8d8d8" stroke-width="1.0" rx="4"/>
<text x="56.0" y="317.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold">3.7.</tspan><tspan> Importe de referencia. El importe a considerar será el nivel máximo del valor de ventas totales</tspan></text>
<text x="56.0" y="341.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>anuales para la categoría “Micro” correspondiente al sector “Comercio” que determine la autoridad</tspan></text>
<text x="56.0" y="365.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>de aplicación de la Ley 24.467 (y sus modificatorias).</tspan></text>
