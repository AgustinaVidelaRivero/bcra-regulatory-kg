<text x="644.0" y="516.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">Importe de referencia — nivel máximo de</text>
<text x="644.0" y="534.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f1f1f">ventas anuales</text>
