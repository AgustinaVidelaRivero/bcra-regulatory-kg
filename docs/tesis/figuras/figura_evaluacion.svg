<text x="151.0" y="63.9" font-size="14" font-weight="bold" fill="#1f1f1f">Lectura de la autora</text>
<text x="151.0" y="86.1" font-size="13" font-weight="normal" fill="#444444">Corrección e importancia de 100 tripletas, y presencia de los 100 primeros hechos</text>
<text x="151.0" y="179.9" font-size="14" font-weight="bold" fill="#1f1f1f">Muestra</text>
<text x="151.0" y="197.9" font-size="14" font-weight="bold" fill="#1f1f1f">de</text>
<text x="151.0" y="215.9" font-size="14" font-weight="bold" fill="#1f1f1f">tripletas</text>
<text x="151.0" y="233.9" font-size="14" font-weight="bold" fill="#1f1f1f">del grafo</text>
<text x="251.0" y="186.9" font-size="14" font-weight="bold" fill="#1f1f1f">Juez de las</text>
<text x="251.0" y="204.9" font-size="14" font-weight="bold" fill="#1f1f1f">tripletas</text>
<text x="251.0" y="227.1" font-size="13" font-weight="normal" fill="#444444">¿Es correcta?</text>
<text x="377.0" y="197.9" font-size="14" font-weight="bold" fill="#1f1f1f">Precisión e</text>
<text x="377.0" y="215.9" font-size="14" font-weight="bold" fill="#1f1f1f">importancia</text>
<text x="504.0" y="169.9" font-size="14" font-weight="bold" fill="#1f1f1f">Juez de</text>
<text x="504.0" y="187.9" font-size="14" font-weight="bold" fill="#1f1f1f">presencia</text>
<text x="504.0" y="210.1" font-size="13" font-weight="normal" fill="#444444">¿Está el</text>
<text x="504.0" y="227.1" font-size="13" font-weight="normal" fill="#444444">hecho en el</text>
<text x="504.0" y="244.1" font-size="13" font-weight="normal" fill="#444444">grafo?</text>
<text x="630.0" y="206.9" font-size="14" font-weight="bold" fill="#1f1f1f">Cobertura</text>
<text x="151.0" y="321.9" font-size="14" font-weight="bold" fill="#1f1f1f">Muestra de</text>
<text x="151.0" y="339.9" font-size="14" font-weight="bold" fill="#1f1f1f">pasajes</text>
<text x="265.0" y="303.9" font-size="14" font-weight="bold" fill="#1f1f1f">Extrae el</text>
<text x="265.0" y="321.9" font-size="14" font-weight="bold" fill="#1f1f1f">hecho más</text>
<text x="265.0" y="339.9" font-size="14" font-weight="bold" fill="#1f1f1f">importante de</text>
<text x="265.0" y="357.9" font-size="14" font-weight="bold" fill="#1f1f1f">cada pasaje</text>
<text x="398.0" y="312.9" font-size="14" font-weight="bold" fill="#1f1f1f">Comprueba que</text>
<text x="398.0" y="330.9" font-size="14" font-weight="bold" fill="#1f1f1f">su tramo esté en</text>
<text x="398.0" y="348.9" font-size="14" font-weight="bold" fill="#1f1f1f">el pasaje</text>
<text x="550.0" y="312.9" font-size="14" font-weight="bold" fill="#1f1f1f">Ordena los</text>
<text x="550.0" y="330.9" font-size="14" font-weight="bold" fill="#1f1f1f">hechos por</text>
<text x="550.0" y="348.9" font-size="14" font-weight="bold" fill="#1f1f1f">importancia</text>
<text x="302.0" y="554.9" font-size="14" font-weight="bold" fill="#1f1f1f">Agente</text>
<text x="302.0" y="577.1" font-size="13" font-weight="normal" fill="#444444">Consulta uno</text>
<text x="302.0" y="594.1" font-size="13" font-weight="normal" fill="#444444">de los 2</text>
<text x="302.0" y="611.1" font-size="13" font-weight="normal" fill="#444444">servidores</text>
<text x="151.0" y="528.9" font-size="14" font-weight="bold" fill="#1f1f1f">Servidor</text>
<text x="151.0" y="546.9" font-size="14" font-weight="bold" fill="#1f1f1f">del grafo</text>
<text x="151.0" y="460.9" font-size="14" font-weight="bold" fill="#1f1f1f">Redacta las</text>
<text x="151.0" y="478.9" font-size="14" font-weight="bold" fill="#1f1f1f">preguntas</text>
<text x="292.0" y="460.9" font-size="14" font-weight="bold" fill="#1f1f1f">Preguntas con</text>
<text x="292.0" y="478.9" font-size="14" font-weight="bold" fill="#1f1f1f">sus criterios</text>
<text x="151.0" y="596.9" font-size="14" font-weight="bold" fill="#1f1f1f">Servidor de</text>
<text x="151.0" y="614.9" font-size="14" font-weight="bold" fill="#1f1f1f">los</text>
<text x="151.0" y="632.9" font-size="14" font-weight="bold" fill="#1f1f1f">fragmentos</text>
<text x="420.0" y="554.9" font-size="14" font-weight="bold" fill="#1f1f1f">Respuesta,</text>
<text x="420.0" y="572.9" font-size="14" font-weight="bold" fill="#1f1f1f">citas y traza</text>
<text x="541.0" y="554.9" font-size="14" font-weight="bold" fill="#1f1f1f">Atribución de</text>
<text x="541.0" y="572.9" font-size="14" font-weight="bold" fill="#1f1f1f">las fallas</text>
<text x="430.0" y="437.9" font-size="14" font-weight="bold" fill="#1f1f1f">Juez de las</text>
<text x="430.0" y="455.9" font-size="14" font-weight="bold" fill="#1f1f1f">respuestas</text>
<text x="430.0" y="478.1" font-size="13" font-weight="normal" fill="#444444">¿Cumple cada</text>
<text x="430.0" y="495.1" font-size="13" font-weight="normal" fill="#444444">criterio?</text>
<text x="590.0" y="452.9" font-size="14" font-weight="bold" fill="#1f1f1f">Comparación con</text>
<text x="590.0" y="470.9" font-size="14" font-weight="bold" fill="#1f1f1f">los fragmentos</text>
<text x="420.0" y="634.9" font-size="14" font-weight="bold" fill="#1f1f1f">Indicadores de las</text>
<text x="420.0" y="652.9" font-size="14" font-weight="bold" fill="#1f1f1f">citas</text>
<text x="608.0" y="634.9" font-size="14" font-weight="bold" fill="#1f1f1f">Fidelidad</text>
<text x="21.0" y="197.9" font-size="14" font-weight="bold" fill="#1f1f1f">El grafo</text>
<text x="21.0" y="215.9" font-size="14" font-weight="bold" fill="#1f1f1f">evaluado</text>
<text x="21.0" y="321.9" font-size="14" font-weight="bold" fill="#1f1f1f">Los</text>
<text x="21.0" y="339.9" font-size="14" font-weight="bold" fill="#1f1f1f">documentos</text>
<text x="21.0" y="587.9" font-size="14" font-weight="bold" fill="#1f1f1f">Los</text>
<text x="21.0" y="605.9" font-size="14" font-weight="bold" fill="#1f1f1f">fragmentos</text>
<text x="21.0" y="623.9" font-size="14" font-weight="bold" fill="#1f1f1f">de los</text>
<text x="21.0" y="641.9" font-size="14" font-weight="bold" fill="#1f1f1f">documentos</text>
<text x="142.0" y="30.9" font-size="14" font-weight="bold" fill="#1f1f1f">Evaluación intrínseca, el contenido del grafo</text>
<text x="142.0" y="404.9" font-size="14" font-weight="bold" fill="#1f1f1f">Evaluación extrínseca, las respuestas del agente</text>
<text x="260.8" y="137.1" font-size="13" font-weight="normal" fill="#444444">se valida contra</text>
<text x="491.2" y="128.6" font-size="13" font-weight="normal" fill="#444444">se valida contra</text>
<text x="57.0" y="707.6" font-size="13" font-weight="normal" fill="#1f1f1f">Pieza que ejecuta un modelo de lenguaje</text>
<text x="57.0" y="729.6" font-size="13" font-weight="normal" fill="#1f1f1f">Reglas fijas</text>
<text x="57.0" y="751.6" font-size="13" font-weight="normal" fill="#1f1f1f">Datos</text>
<text x="57.0" y="773.6" font-size="13" font-weight="normal" fill="#1f1f1f">Lectura de la autora</text>
<text x="57.0" y="795.6" font-size="13" font-weight="normal" fill="#1f1f1f">Resultado</text>
