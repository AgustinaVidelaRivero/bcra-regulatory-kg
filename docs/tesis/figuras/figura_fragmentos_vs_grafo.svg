<text x="430.0" y="51.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">Para una entidad financiera, ¿qué condiciones hacen que los créditos para consumo o vivienda</text>
<text x="430.0" y="75.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">deban clasificarse en la cartera comercial?</text>
