<text x="52.0" y="311.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold" fill="#8a4513">punto 3.7.</tspan><tspan> y cuyo repago no se encuentre</tspan></text>
<text x="52.0" y="335.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>vinculado a ingresos fijos o periódicos del</tspan></text>
