<text x="52.0" y="187.0" font-size="15" font-weight="bold" fill="#333">recuperado · puesto 2</text>
<text x="52.0" y="215.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold">5.1.1.1.</tspan><tspan> Los créditos para consumo o</tspan></text>
<text x="52.0" y="239.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>vivienda. Los créditos de esta clase que</tspan></text>
<rect x="240.9" y="248.0" width="103.1" height="22.0" fill="#e07b39" opacity="0.26" rx="2"/>
<text x="52.0" y="263.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>superen el equivalente a </tspan><tspan font-weight="bold" fill="#8a4513">dos veces el</tspan></text>
<rect x="51.0" y="272.0" width="316.6" height="22.0" fill="#e07b39" opacity="0.26" rx="2"/>
<text x="52.0" y="287.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan font-weight="bold" fill="#8a4513">importe de referencia establecido en el</tspan></text>
