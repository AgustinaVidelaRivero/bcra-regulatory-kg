<text x="52.0" y="483.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan font-weight="bold">3.7.</tspan><tspan> Importe de referencia. El importe a</tspan></text>
<text x="52.0" y="507.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan>considerar será el nivel máximo del valor de</tspan></text>
<text x="52.0" y="531.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan>ventas totales anuales para la categoría</tspan></text>
<text x="52.0" y="555.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan>“Micro” correspondiente al sector “Comercio”</tspan></text>
<text x="52.0" y="579.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan>que determine la autoridad de aplicación de</tspan></text>
<text x="52.0" y="603.0" font-size="17" fill="#9a9a9a" xml:space="preserve"><tspan>la Ley 24.467 (y sus modificatorias).</tspan></text>
