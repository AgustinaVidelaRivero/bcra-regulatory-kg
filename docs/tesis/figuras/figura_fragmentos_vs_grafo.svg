<text x="52.0" y="383.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>productiva o comercial se incluirán dentro de</tspan></text>
<text x="52.0" y="407.0" font-size="17" fill="#1f1f1f" xml:space="preserve"><tspan>la cartera comercial.</tspan></text>
