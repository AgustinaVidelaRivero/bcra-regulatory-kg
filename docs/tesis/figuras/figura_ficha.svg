<text x="414.5" y="230.9" font-size="14" font-weight="bold" fill="#1f1f1f">Excepcion</text>
<text x="394.0" y="247.1" font-size="13" font-weight="normal" fill="#1f1f1f">Excepción — accionistas entidad financiera con</text>
<text x="394.0" y="263.1" font-size="13" font-weight="normal" fill="#1f1f1f">supervisión consolidada</text>
<rect x="387.0" y="276.0" width="322.0" height="56.0" rx="2" fill="white" stroke="#999999" stroke-width="1.0"/>
<text x="394.0" y="291.9" font-size="13" font-weight="normal" fill="#555555">e4</text>
<text x="414.5" y="291.9" font-size="14" font-weight="bold" fill="#1f1f1f">Restriccion</text>
<text x="394.0" y="308.1" font-size="13" font-weight="normal" fill="#1f1f1f">Exigencia de auditoría — grupos consolidados del</text>
<text x="394.0" y="324.1" font-size="13" font-weight="normal" fill="#1f1f1f">exterior</text>
<rect x="387.0" y="337.0" width="322.0" height="40.0" rx="2" fill="white" stroke="#e07b39" stroke-width="1.6"/>
<text x="394.0" y="352.9" font-size="13" font-weight="normal" fill="#555555">e5</text>
<text x="414.5" y="352.9" font-size="14" font-weight="bold" fill="#1f1f1f">Operacion</text>
<text x="394.0" y="369.1" font-size="13" font-weight="normal" fill="#1f1f1f">Formación de grupo económico</text>
<text x="387.0" y="399.1" font-size="13" font-weight="normal" fill="#555555">Relaciones: origen, nombre y destino</text>
