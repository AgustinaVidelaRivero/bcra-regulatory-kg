<text x="394.0" y="141.1" font-size="13" font-weight="normal" fill="#1f1f1f">consolidados</text>
<rect x="387.0" y="154.0" width="322.0" height="56.0" rx="2" fill="white" stroke="#999999" stroke-width="1.0"/>
