<svg xmlns="http://www.w3.org/2000/svg" width="15.00cm" height="13.67cm" viewBox="0 0 720 656" font-family="Helvetica,Arial,sans-serif">
<rect width="720" height="656" fill="white"/>
<defs><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e07b39"/></marker></defs>
<text x="11.0" y="21.9" font-size="14" font-weight="bold" fill="#1f1f1f">Unidad de extracción del punto 7.2</text>
<rect x="11.0" y="31.0" width="340.0" height="23.0" rx="2" fill="#f4f6f8" stroke="#999999" stroke-width="1.0"/>
<text x="18.0" y="46.1" font-size="13" font-weight="normal" fill="#555555">Sección 7. Información especial.</text>
<rect x="11.0" y="63.0" width="340.0" height="422.0" rx="2" fill="white" stroke="#4a5a6a" stroke-width="1.3"/>
<text x="18.0" y="78.1" font-size="13" font-weight="normal" fill="#1f1f1f">7.2. Estados financieros consolidados.</text>
<text x="18.0" y="99.1" font-size="13" font-weight="normal" fill="#1f1f1f">Las entidades financieras deberán requerir a cada uno</text>
<text x="18.0" y="115.1" font-size="13" font-weight="normal" fill="#1f1f1f">de los accionistas del país o del exterior o, en su caso,</text>
<text x="18.0" y="131.1" font-size="13" font-weight="normal" fill="#1f1f1f">grupo de accionistas que la controlen, la elaboración de</text>
<text x="18.0" y="147.1" font-size="13" font-weight="normal" fill="#1f1f1f">estados financieros semestrales consolidados del grupo</text>
<text x="18.0" y="163.1" font-size="13" font-weight="normal" fill="#1f1f1f">o conjunto económico que conformen, con dictamen de</text>
<text x="18.0" y="179.1" font-size="13" font-weight="normal" fill="#1f1f1f">contador público. Dichos estados financieros deberán</text>
<text x="18.0" y="195.1" font-size="13" font-weight="normal" fill="#1f1f1f">ser presentados a la SEFyC dentro de los 120 días</text>
<rect x="237.4" y="200.0" width="52.6" height="15.0" rx="2" fill="#e1e7ee" stroke="none"/>
<text x="18.0" y="211.1" font-size="13" font-weight="normal" fill="#1f1f1f">corridos de concluidos los semestres,</text>
<text x="238.4" y="211.1" font-size="13" font-weight="normal" fill="#1f1f1f">salvo las</text>
<rect x="17.0" y="216.0" width="272.8" height="15.0" rx="2" fill="#e1e7ee" stroke="none"/>
<text x="18.0" y="227.1" font-size="13" font-weight="normal" fill="#1f1f1f">excepciones que determine el Superintendente</text>
<text x="289.8" y="227.1" font-size="13" font-weight="normal" fill="#1f1f1f">.</text>
<text x="18.0" y="248.1" font-size="13" font-weight="normal" fill="#1f1f1f">El requerimiento informativo precedente no resulta</text>
<text x="18.0" y="264.1" font-size="13" font-weight="normal" fill="#1f1f1f">aplicable cuando los accionistas o grupo de accionistas</text>
<text x="18.0" y="280.1" font-size="13" font-weight="normal" fill="#1f1f1f">tengan el carácter de entidad financiera del país o del</text>
<text x="18.0" y="296.1" font-size="13" font-weight="normal" fill="#1f1f1f">exterior, siempre que en el país de origen exista un</text>
<text x="18.0" y="312.1" font-size="13" font-weight="normal" fill="#1f1f1f">régimen de supervisión consolidada. En el caso de</text>
<text x="18.0" y="328.1" font-size="13" font-weight="normal" fill="#1f1f1f">estados financieros consolidados de grupos del exterior,</text>
<text x="18.0" y="344.1" font-size="13" font-weight="normal" fill="#1f1f1f">se exigirá que se encuentren auditados por firmas de</text>
<text x="18.0" y="360.1" font-size="13" font-weight="normal" fill="#1f1f1f">reconocido prestigio.</text>
<rect x="15.0" y="368.5" width="332.0" height="114.0" rx="2" fill="#fbe3d3" stroke="none"/>
<text x="18.0" y="381.1" font-size="13" font-weight="normal" fill="#1f1f1f">Se considerará que dos o más personas humanas o</text>
<text x="18.0" y="397.1" font-size="13" font-weight="normal" fill="#1f1f1f">jurídicas forman un conjunto o grupo económico con la</text>
<text x="18.0" y="413.1" font-size="13" font-weight="normal" fill="#1f1f1f">entidad financiera si están vinculadas a ésta por</text>
<text x="18.0" y="429.1" font-size="13" font-weight="normal" fill="#1f1f1f">relación de control conforme a lo previsto en las normas</text>
<text x="18.0" y="445.1" font-size="13" font-weight="normal" fill="#1f1f1f">sobre “Grandes exposiciones al riesgo de crédito”. Se</text>
<text x="18.0" y="461.1" font-size="13" font-weight="normal" fill="#1f1f1f">aplicará la definición de “control” contenida en el punto</text>
<text x="18.0" y="477.1" font-size="13" font-weight="normal" fill="#1f1f1f">1.2.2.1. de la citada norma.</text>
<text x="11.0" y="501.1" font-size="13" font-weight="normal" fill="#555555">Lugar: Autorización y composición del capital de entidades</text>
<text x="11.0" y="517.1" font-size="13" font-weight="normal" fill="#555555">financieras, punto 7.2</text>
<text x="387.0" y="21.9" font-size="14" font-weight="bold" fill="#1f1f1f">Extracción cruda</text>
<text x="387.0" y="41.1" font-size="13" font-weight="normal" fill="#555555">Entidades: identificador, tipo y etiqueta</text>
<rect x="387.0" y="48.0" width="322.0" height="40.0" rx="2" fill="white" stroke="#999999" stroke-width="1.0"/>
