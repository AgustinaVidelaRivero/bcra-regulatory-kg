<text x="394.0" y="186.1" font-size="13" font-weight="normal" fill="#1f1f1f">Presentación a SEFyC — estados financieros</text>
<text x="394.0" y="202.1" font-size="13" font-weight="normal" fill="#1f1f1f">consolidados</text>
<rect x="387.0" y="215.0" width="322.0" height="56.0" rx="2" fill="white" stroke="#999999" stroke-width="1.0"/>
